<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISME — Fiche du jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--ok:#1E7A46;--warn:#B7791F;--err:#B42318;--plus:#1E7A46;--moins:#B42318;
  --SYS:#4f6b8f;--EXP:#7a5c8f;--EDI:#6b8f5c;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2;--ok:#5CC98A;--warn:#E0A84A;--err:#F2837A;--plus:#5CC98A;--moins:#F2837A;--SYS:#8aa6cc;--EXP:#b49ccc;--EDI:#9cc58c}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)}
.barre a{text-decoration:none} #qui a{margin-left:10px}
main{max-width:920px;margin:0 auto;padding:10px 24px 40px}
.retour{font-size:13.5px;color:var(--muted);text-decoration:none} .retour:hover{text-decoration:underline}
.entete{display:flex;gap:22px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-top:8px}
.entete img,.entete .sans-image{width:120px;height:120px;border-radius:12px;object-fit:cover;flex:none;background:var(--paper);border:1px solid var(--line)}
.entete h1{font:600 clamp(28px,5vw,42px)/1.1 var(--serif);margin:0 0 4px}
.entete .sous{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.chiffres{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:0}
.chiffres span b{font-weight:600}
.actions-eval{margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 26px;margin-top:16px}
section h2{font:600 22px/1.25 var(--serif);margin:0 0 4px}
section .question{font:italic 15px var(--serif);color:var(--muted);margin:0 0 14px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.notes div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;border-top:4px solid var(--c, var(--ink))}
.notes small{display:block;font-size:12.5px;color:var(--muted)} .notes b{font:600 26px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.notes .finale b{font-size:32px}
.ecart{font-size:13px;color:var(--muted);margin-left:6px} .ecart.plus{color:var(--plus)} .ecart.moins{color:var(--moins)}
table.paires{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0 14px}
table.paires th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:6px 8px}
table.paires td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.paires .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.paires .axes{color:var(--muted);font-size:13.5px}
table.paires .axes span{white-space:nowrap;margin-right:12px}
h3.chap{font:600 17px var(--serif);margin:14px 0 2px;color:var(--c)}
.bandeau{font-size:14.5px;background:var(--paper);border-radius:8px;padding:10px 14px;margin:8px 0}
.discret{color:var(--muted);font-size:13.5px}
.proto{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:0 3px;color:var(--muted);vertical-align:2px}
.btn{display:inline-block;font:500 14px var(--sans);padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink)}
.vide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 26px;font:italic 18px/1.5 var(--serif);color:var(--muted)}
.vide a{color:var(--ink)}
.version{font-size:12px;color:var(--muted);text-align:right;margin-top:24px}
@media (max-width:640px){ main{padding:8px 12px 30px} .entete{flex-direction:column;padding:18px} .entete img,.entete .sans-image{width:80px;height:80px} section{padding:18px} }
</style>
</head>
<body>
<div class="barre"><a href="index.html" class="marque" title="Accueil de PRISME">PRISME</a><span id="qui"></span></div>
<main>
  <a class="retour" href="jeux.html">← Tous les jeux</a>
  <div id="contenu"><p class="vide">Chargement…</p></div>
  <p class="version" id="version"></p>
</main>

<script src="timeline.js?v=3.4"></script>
<script>
const VERSION = { numero:"1.1", date:"2026-10-13 21:43" };   // à incrémenter à chaque livraison
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";   // clé publique : protégée par les droits de la base
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, k = 2) => v == null || Number.isNaN(v) ? "—" : Number(v).toFixed(k).replace(".", ",").replace("-", "−");
$("#version").textContent = `Fiche du jeu ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} · timeline ${TIMELINE_VERSION.numero}`;

/* ---- connexion : tout passe par la Forge ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  $("#qui").innerHTML = u ? `<span>${esc(u.email)}</span> <a href="#" id="deconnexion">Se déconnecter</a>` : `<a href="${versForge()}">Se connecter</a>`;
  const d = $("#deconnexion"); if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session?.user){ location.replace(versForge()); return; }
  afficherCompte(session.user);
  if (!demarre){ demarre = true; setTimeout(() => afficher(session.user), 0); }
});
const vide = html => $("#contenu").innerHTML = `<p class="vide">${html}</p>`;
const NIVEAUX = { joueur:0, lecteur:1, evaluateur:2, editeur:3, proprietaire:4 };

async function afficher(user){
  const code = new URLSearchParams(location.search).get("jeu");
  if (!code) return vide('Aucun jeu choisi. <a href="jeux.html">Voir tous les jeux</a>.');
  const [{ data: r }, { data: res }, { data: chapitres }, d] = await Promise.all([
    sb.rpc("prisme_mon_role"),
    sb.from("prisme_player_resultats").select("style,classement").eq("user_id", user.id).order("passe_le", { ascending:false }).limit(1),
    sb.from("prisme_chapitres").select("code,nom,ordre").order("ordre"),
    lireJeuxEvalues(sb)]);
  const role = r || "joueur";
  if (d.refus) return vide("La fiche des jeux n'est pas encore ouverte aux joueurs : le script 25 doit être passé dans la base.");
  const jeu = d.jeux.find(j => j.code === code);
  if (!jeu) return vide('Ce jeu n\'existe pas. <a href="jeux.html">Voir tous les jeux</a>.');
  document.title = `PRISME — ${jeu.nom}`;
  const profil = codeDeResultat(res?.[0]);
  const F = d.fiches.filter(f => f.jeu === code), R = resumeJeu(F, d.paires, d.axes, profil);
  // l'évaluation : « Voir mon évaluation » ou « Évaluer » pour l'évaluateur, « Voir l'évaluation » pour le lecteur s'il en existe une, rien pour le joueur
  let lienEval = "";
  if (NIVEAUX[role] >= NIVEAUX.lecteur){
    const { data: T } = await sb.from("prisme_evaluations").select("id,evaluateur,statut").eq("jeu", code);
    const mienne = (T || []).find(f => f.evaluateur === user.id), url = "evaluation.html?jeu=" + encodeURIComponent(code);
    if (NIVEAUX[role] >= NIVEAUX.evaluateur) lienEval = mienne ? `<a class="btn" href="${url}">Voir mon évaluation</a>` : `<a class="btn" href="${url}&evaluer=1">Évaluer</a>`
      + (!mienne && T?.length ? ` <a class="btn" href="${url}">Voir l'évaluation</a>` : "");
    else if (T?.length) lienEval = `<a class="btn" href="${url}">Voir l'évaluation</a>`;
  }
  const actions = lienEval ? `<p class="actions-eval">${lienEval}</p>` : "";
  const img = jeu.image_url ? `<img src="${esc(jeu.image_url)}" alt="">` : `<span class="sans-image"></span>`;
  const bgg = jeu.bgg_id ? ` · <a href="https://boardgamegeek.com/boardgame/${encodeURIComponent(jeu.bgg_id)}" target="_blank" rel="noopener">BoardGameGeek</a>` : "";
  if (!R){
    $("#contenu").innerHTML = `<div class="entete">${img}<div><h1>${esc(jeu.nom)}</h1><p class="sous">Pas encore de fiche finale${bgg}</p>${actions}</div></div>
      <section><p class="discret">Ce jeu n'a pas encore été évalué jusqu'au bout : ses notes paraîtront ici dès qu'une fiche sera déclarée finale.</p></section>`;
    return;
  }
  const m = R.m, ch = [];
  if (m.joueurs_min != null) ch.push(`<span>Joueurs <b>${m.joueurs_min === m.joueurs_max ? m.joueurs_min : `${m.joueurs_min} à ${m.joueurs_max}`}</b></span>`);
  if (m.effectif_reference != null) ch.push(`<span>Meilleur à <b>${Math.round(m.effectif_reference)}</b></span>`);
  if (m.duree_max != null) ch.push(`<span>Durée <b>${m.duree_min != null && Math.round(m.duree_min) !== Math.round(m.duree_max) ? `${Math.round(m.duree_min)} à ${Math.round(m.duree_max)}` : Math.round(m.duree_max)} min</b></span>`);
  if (m.pages != null) ch.push(`<span>Règles <b>${Math.round(m.pages)} pages</b></span>`);
  if (m.prix != null) ch.push(`<span>Prix <b>${fmt(m.prix, 0)} €</b></span>`);
  if (m.poids_bgg != null) ch.push(`<span>Poids BGG <b>${fmt(m.poids_bgg)}</b></span>`);
  const ecart = (a, b) => { if (a == null || b == null) return ""; const v = a - b;
    return `<span class="ecart ${v >= .005 ? "plus" : v <= -.005 ? "moins" : ""}">${Math.abs(v) < .005 ? "±" : v > 0 ? "+" : "−"}${fmt(Math.abs(v))}</span>`; };

  // les notes : finale, chapitres, et pour vous
  const nomCh = c => chapitres?.find(x => x.code === c)?.nom || c;
  let h = `<div class="entete">${img}<div><h1>${esc(jeu.nom)}</h1><p class="sous">${F.length} fiche${F.length > 1 ? "s" : ""} finale${F.length > 1 ? "s" : ""}${F.length > 1 ? " (moyenne)" : ""}${bgg}</p><p class="chiffres">${ch.join("")}</p>${actions}</div></div>
  <section><h2>Les notes</h2><p class="question">Sur 5 : chaque chapitre est la moyenne de ses paires, la note finale la moyenne des trois chapitres.</p>
    <div class="notes"><div class="finale"><small>Note PRISME</small><b>${fmt(R.finale)}</b></div>
    ${(chapitres || []).filter(c => R.chap[c.code] != null).map(c => `<div style="--c:var(--${esc(c.code)})"><small>${esc(c.nom)}</small><b>${fmt(R.chap[c.code])}</b></div>`).join("")}
    ${R.notePour != null ? `<div style="--c:var(--accent)"><small>Pour vous</small><b>${fmt(R.notePour)}</b>${ecart(R.notePour, R.finale)}</div>` : ""}</div>
    ${!profil ? `<p class="discret" style="margin-top:10px"><a href="questionnaire.html">Passez le questionnaire du joueur</a> pour voir la note et la courbe de ce jeu pour vous.</p>` : ""}
  </section>`;

  // la timeline
  if (R.complet){
    const c = R.c;
    h += `<section><h2>Sa vie dans le temps</h2><p class="question">La timeline : le plaisir net (le flow) de l'ouverture de la boîte jusqu'au jeu rangé, session après session.</p>
      <div class="bandeau">${esc(syntheseTimeline(c))}</div>
      <figure class="courbe-box" style="margin:10px 0">${courbeSVG(c, jeu.nom)}<figcaption>En haut, les jalons ; en bas, les sessions cumulées. Pointillés : le Souvenir, qui descend jusqu'au plancher de nostalgie.</figcaption></figure>
      ${R.cPour ? `<h3 style="font:600 18px var(--serif);margin:16px 0 4px">Pour vous</h3><div class="bandeau">${esc(syntheseTimeline(R.cPour))}</div>
        <figure class="courbe-box" style="margin:10px 0">${courbeSVG(R.cPour, jeu.nom, c)}<figcaption>Votre courbe, d'après votre profil de joueur ; en pointillé gris, la courbe pour tous.</figcaption></figure>` : ""}
      <p class="discret">Coût par session : <b>${esc(texteCout(R.cout))}</b> · Coût d'effort <span class="proto">proto</span> : <b>${fmt(R.effort)}</b> / 5 (règles, manuels, logistique, hasard, renouvellement, attente).</p>
    </section>`;
  } else {
    h += `<section><h2>Sa vie dans le temps</h2><p class="discret">La timeline paraîtra quand toutes les paires utiles seront notées.</p></section>`;
  }

  // les paires : notes et axes (sans les justifications)
  const ax = code2 => d.axes.find(a => a.code === code2);
  const val = a => { const v = m.saisie[a.code]; if (!v) return null; if (v.sans_objet) return "sans objet"; if (v.valeur == null) return null;
    return a.echelle === "ecart" ? (v.valeur > 0 ? "+" : "") + fmt(v.valeur, 1) : fmt(v.valeur, 1); };
  h += `<section><h2>Les paires</h2><p class="question">Pour chaque paire, sa note et les axes qui la composent. Les écarts (+ / −) disent ce que le jeu réussit au-delà ou en deçà de ce qu'on attendait.</p>`;
  (chapitres || []).forEach(c => {
    const P = R.e.paires.filter(p => p.chap === c.code); if (!P.length) return;
    h += `<h3 class="chap" style="--c:var(--${esc(c.code)})">${esc(c.nom)}</h3><table class="paires"><thead><tr><th>Paire</th><th class="n">Note</th><th>Axes</th></tr></thead><tbody>
      ${P.map(p => { const pn = d.paires.find(x => x.code === p.code), A = d.axes.filter(a => a.paire === p.code && a.echelle !== "calcule");
        return `<tr><td>${esc(pn?.nom || p.code)}</td><td class="n"><b>${p.note == null ? (R.e.absents.includes(p.code) ? "s. o." : "—") : fmt(p.note)}</b></td>
          <td class="axes">${A.map(a => { const v = val(a); return v == null ? "" : `<span>${esc(a.nom)} : <b>${esc(v)}</b></span>`; }).join(" ")}</td></tr>`; }).join("")}
    </tbody></table>`;
  });
  h += `</section>`;
  $("#contenu").innerHTML = h;
}
</script>
<script src="entete.js?v=1.3"></script>
</body>
</html>
