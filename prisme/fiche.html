<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISME — Mon profil de joueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F6F5F1;--panel:#FFFFFF;--accent:#3D2645;--arch:#888;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3542;--paper:#11161D;--panel:#171D25;--accent:#C9B4D2}}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:inherit}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:inherit!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)}
.barre a{text-decoration:none}
#qui a{margin-left:10px}

main{max-width:860px;margin:0 auto;padding:10px 24px 40px}
.entete{border-top:10px solid var(--arch);background:var(--panel);border-radius:12px;padding:22px 26px 20px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.entete .surtitre{font:500 22px/1.25 var(--sans);color:var(--ink);margin:0}   /* (3.18) nettement plus visible */
.entete h1{font:600 clamp(36px,6vw,54px)/1.05 var(--serif);margin:4px 0 6px}
.entete .filiation{font:italic 19px/1.4 var(--serif);color:var(--muted);margin:0}
/* deux niveaux : le tempérament (1 joueur sur 20) puis le style (1 sur 60) ; le moteur dominant se lit dans l'histogramme */
.entete h1.niveaux{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font:600 clamp(26px,4.4vw,40px)/1.15 var(--serif);margin:8px 0 4px}
.niveaux .niv{display:inline-flex;flex-direction:column}
.niveaux small{font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.niveaux .arch{font-size:clamp(38px,6.5vw,60px);line-height:1.05;color:var(--arch)}
.niveaux .prof{font-size:clamp(38px,6.5vw,60px);line-height:1.05;color:var(--arch)}
.niveaux .sous{font-size:.85em;color:color-mix(in srgb, var(--sous) 80%, var(--ink))}
.niveaux .sep{color:var(--line);font-weight:400}
/* (3.18) bandeau en symétrie : à gauche le totem puis le tempérament ; à droite le style puis son emblème, calés à droite.
   Quand la place manque (téléphone), le style passe sous le tempérament, toujours calé à droite. */
.entete .bandeau{display:flex;align-items:center;gap:22px;margin:14px 0 16px}
.bandeau .noms{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 18px}
.entete h1.titre-joueur{margin:0;font:600 clamp(34px,6vw,58px)/1 var(--serif);color:var(--arch);min-width:0}
.bandeau .qualif{margin:0 0 0 auto;text-align:right;font:italic 400 clamp(22px,3.5vw,34px)/1.1 var(--serif);color:color-mix(in srgb, var(--sous) 75%, var(--ink))}
.entete .totem{flex:none;width:118px;height:118px;display:block;background:color-mix(in srgb, var(--arch) 9%, var(--panel));border-radius:22px;padding:15px}
.entete .totem.embleme{background:color-mix(in srgb, var(--paper) 70%, var(--panel))}
@media (max-width:560px){ .entete .bandeau{gap:10px} }
@media (max-width:560px){ .entete .totem{width:52px;height:52px;padding:7px;border-radius:12px} .entete h1.titre-joueur{font-size:6.6vw} .bandeau .qualif{font-size:5.2vw} }
/* (3.18) la barre fine qui garde le profil en vue quand le cadre principal sort de l'écran ; sous la barre collante d'entete.js (--ent-h) */
.mini-profil{position:fixed;left:0;right:0;top:max(var(--ent-h, 0px), env(safe-area-inset-top, 0px));z-index:39;display:flex;align-items:center;gap:10px;
  padding:5px max(16px, env(safe-area-inset-right, 0px)) 5px max(16px, env(safe-area-inset-left, 0px));background:var(--panel);border-bottom:1px solid var(--line);
  border-top:3px solid var(--arch);box-shadow:0 2px 8px rgba(0,0,0,.08);font:600 16px/1.2 var(--serif);cursor:pointer;
  transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .2s, opacity .2s}
.mini-profil.visible{transform:none;opacity:1;pointer-events:auto}
.mini-profil svg{width:28px;height:28px;flex:none}
.mini-profil .m-tem{color:var(--arch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini-profil .m-sty{font-style:italic;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (prefers-reduced-motion: reduce){ .mini-profil{transition:none} }
.entete .sous-titre{font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:0}
@media (max-width:520px){ .niveaux .sep{display:none} }
.entete .date{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:right}   /* (3.18) plus petite, calée à droite */
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 26px;margin-top:16px}
section h2{font:600 22px/1.25 var(--serif);margin:0 0 2px}
section .question{font:italic 15px var(--serif);color:var(--muted);margin:0 0 12px}
section p{margin:0 0 10px;font:16.5px/1.65 var(--serif)}
.devise{font-style:italic;color:var(--muted)}
.libelle{font:600 13px var(--sans);color:var(--muted);display:block;margin-bottom:1px}
/* les cinq moteurs, du plus fort au plus faible */
.moteurs{display:grid;grid-template-columns:118px minmax(90px,1fr) 58px fit-content(330px);gap:8px 12px;align-items:center}   /* (3.18) une seule grille : les barres gardent la même longueur */
/* (3.18) la mention (dominant, second, fui) sur la même ligne que la barre, juste après le pourcentage ; elle passe à la ligne dans sa colonne si la place manque */
.moteur{display:contents}
.moteur .nom{font-weight:500}
.moteur .piste{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.moteur .plein{display:block;height:100%;border-radius:7px}
.moteur .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.moteur .role{font-size:12.5px;line-height:1.3;color:var(--muted)}
section ul{margin:2px 0 12px;padding-left:20px;font:16px/1.55 var(--serif)}
section h3{font:600 19px/1.3 var(--serif);margin:6px 0 6px} section h3 small.code,.rival small.code{font:13px var(--sans);color:var(--muted);font-weight:400}
.facettes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.facette{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;font:14px var(--sans);text-align:left}
.facette svg{width:34px;height:34px;flex:none}
.facette span{display:flex;flex-direction:column;line-height:1.25} .facette small{font-size:12px;color:var(--muted)}
.facette[aria-selected="true"]{border-color:var(--ink);background:var(--panel);box-shadow:0 0 0 1px var(--ink)}
.rival{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:start;margin-bottom:6px}
.s-embleme{float:right;width:76px;height:76px;padding:10px;margin:0 0 8px 14px;border-radius:16px;background:var(--paper)}
.rival .r-totem{width:84px;height:84px;padding:10px;border-radius:16px;background:var(--paper)}
#rival table.pj-jeux{font-size:15px}
.fb{font-size:14px;color:var(--muted);font-style:italic;text-align:right}   /* (3.18) seulement pour qui a accès à Flamme Bleue */
/* timeline */
.timeline svg{width:100%;height:auto;display:block}
.timeline .note{font-size:13px;color:var(--muted);margin:8px 0 0}
details.repli{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:16px}
details.repli > summary{cursor:pointer;padding:14px 26px;font:600 17px var(--serif);list-style:none;display:flex;align-items:baseline;gap:10px}
details.repli > summary::-webkit-details-marker{display:none}
details.repli > summary::before{content:"▸";color:var(--muted);font-size:14px;transition:transform .15s}
details.repli[open] > summary::before{transform:rotate(90deg)}
details.repli > summary small{font:13px var(--sans);color:var(--muted);font-weight:400}
details.repli > section{border:0;margin:0;padding-top:0}
#vos-jeux table.pj-jeux{font-size:15px}
#rival-jeux, #vos-jeux-corps{overflow-x:auto}   /* 3.11 : sur téléphone, les tableaux de jeux défilent dans leur cadre */
.version{font-size:12px;color:var(--muted);text-align:right;margin-top:24px}
.vide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 26px;font:italic 18px/1.5 var(--serif);color:var(--muted)}
.vide a{color:var(--ink)}
@media (max-width:700px){ .trois{grid-template-columns:1fr} .moteurs{grid-template-columns:auto minmax(40px,1fr) auto minmax(0,1.6fr);gap:8px} .moteur .nom{font-size:15px} .moteur .pct{font-size:13px} main{padding:8px 14px 30px} section,.entete{padding:18px} }
</style>
</head>
<body>
<div class="barre"><a href="index.html" class="marque" title="Accueil de PRISME">PRISME</a><span id="qui"></span></div>
<main id="contenu"><p class="vide">Chargement…</p></main>
<main><p class="version"><span id="credit"></span><br><span id="version"></span><br><span class="droits">© 2026 Pierre Pigeon, tous droits réservés · <a href="https://github.com/pierrepigeon-ui/laFORGE/blob/main/LICENSE" target="_blank" rel="noopener" style="color:inherit">conditions</a></span></p></main>

<script src="timeline.js?v=3.19"></script>
<script src="totems.js?v=4"></script>
<script>
const VERSION = { numero:"3.19", date:"2026-11-11 13:05" };   // à incrémenter à chaque livraison
// (3.18, 10/11/2026) surtitre plus visible ; bandeau en symétrie (totem, tempérament | style, emblème) ; plus de ligne « Tempérament X/y, style X.y/z »
// ni d'info-bulle du style ; dernière ligne du cadre plus petite, à droite ; mentions des moteurs sur la ligne de la barre ; plus aucun code « B/w »
// à l'affichage ; « Vos jeux » avant « Votre rival » ; « Votre moment » masqué (frise en commentaire) ; barre fine du profil quand le cadre sort
// de l'écran ; « Dans Flamme Bleue » seulement pour qui y a accès (flamme_mon_role) ; timeline.js 3.18 (sessions en nombres entiers)
// (3.17, 10/11/2026) timeline.js 3.17 (sans l'ancienne configuration) ; rien d'autre ne change
// (3.16, 08/11/2026) timeline.js 3.15 : dans « vos jeux » et « pour vous deux », la version (base ou all-in) la mieux notée pour ce profil
// (3.15, 06/11/2026) timeline.js 3.13 : une seule sous-fiche par jeu dans « vos jeux » ; le nom du jeu sans « (all-in) »
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";   // clé publique : protégée par les droits de la base
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maj = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const puces = t => `<ul>${String(t ?? "").split("\n").filter(Boolean).map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
$("#version").textContent = `Fiche du joueur ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} · timeline ${TIMELINE_VERSION.numero}`;


/* ---- connexion : tout passe par la Forge (portail commun, à la racine du site) ---- */
const versForge = () => "../?retour=" + encodeURIComponent(location.href);
function afficherCompte(u){
  const el = document.getElementById("qui");
  el.innerHTML = u ? `<span>${String(u.email).replace(/[&<>"']/g, "")}</span> <a href="#" id="deconnexion">Se déconnecter</a>`
                   : `<a href="${versForge()}">Se connecter</a>`;
  const d = document.getElementById("deconnexion");
  if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session?.user){ location.replace(versForge()); return; }   // page réservée : on passe par la Forge
  afficherCompte(session.user);
  if (!demarre){ demarre = true; setTimeout(() => afficher(session?.user || null), 0); }
});

const vide = html => $("#contenu").innerHTML = `<p class="vide">${html}</p>`;

async function afficher(user){
  if (!user) return;
  const id = new URLSearchParams(location.search).get("resultat");
  let q = sb.from("prisme_player_resultats").select("*");
  q = id ? q.eq("id", id) : q.eq("user_id", user.id).order("passe_le", { ascending:false }).limit(1);
  const { data: res, error } = await q;
  if (error) return vide("Lecture impossible : " + esc(error.message));
  const r = res?.[0];
  if (!r) return vide(id ? "Ce résultat n'existe pas, ou vous n'avez pas le droit de le voir."
                         : 'Vous n\'avez pas encore de profil de joueur. <a href="questionnaire.html">Passer le questionnaire</a>.');
  const c = r.classement, code = r.style || (c ? c[0] + "." + c[1].toLowerCase() + "/" + c[4].toLowerCase() : null);
  const [, { data: mot }, { data: tems }, { data: stys }, fb] = await Promise.all([
    chargerTotems(),   // sans images, la fiche s'affiche quand même
    sb.from("prisme_player_moteurs").select("*").order("ordre"),
    sb.from("prisme_player_temperaments").select("*").order("ordre"),
    sb.from("prisme_player_styles").select("*").order("ordre"),
    sb.rpc("flamme_mon_role").then(x => x, () => ({ data:null }))   // (3.18) accès à Flamme Bleue : les lignes « Dans Flamme Bleue » ne s'affichent que pour lui
  ]);
  FB = fb?.data != null;
  TEMS = Object.fromEntries((tems || []).map(t => [t.code, t]));
  const STY = Object.fromEntries((stys || []).map(x => [x.code, x]));
  const tem = code && TEMS[temperamentDe(code)], sty = code && STY[styleDe(code)];
  if (!tem || !sty) return vide("Profil illisible. <a href=\"questionnaire.html\">Repasser le questionnaire</a>.");
  const M = Object.fromEntries(mot.map(m => [m.code, m])), dom = M[tem.moteur]; MOT = M;
  const nbRep = Object.keys(r.reponses || {}).length, complet = nbRep >= 25;
  const facs = facettes(r.scores, tem.code), rival = tem.fuit + "/" + tem.moteur.toLowerCase(), tr = TEMS[rival];
  const autre = r.user_id !== user.id;
  document.documentElement.style.setProperty("--arch", dom.couleur || "#888");
  document.title = `PRISME — ${maj(tem.nom)} (${sty.nom})`;

  const ordre = r.classement.split("");
  const moteurs = ordre.map((c, i) => {
    const m = M[c], pct = Number(r.scores?.[c] ?? 0);
    const role = i === 0 ? "votre moteur dominant" : i === 1 ? "votre second moteur : il donne votre style" : i === 4 ? "le moteur que vous fuyez : il donne votre tempérament" : "";
    return `<div class="moteur"><span class="nom">${esc(m.nom)}</span>
      <span class="piste"><span class="plein" style="width:${Math.min(100, pct)}%;background:${m.couleur}"></span></span>
      <span class="pct">${pct.toFixed(1).replace(".", ",")} %</span>
      <span class="role">${role}</span></div>`;
  }).join("");

  $("#contenu").innerHTML = `
    <div class="entete">
      <p class="surtitre">${autre ? "Profil de joueur" : "Mon profil de joueur"}</p>
      <div class="bandeau">
        ${totemSVG(tem.code, dom.couleur, { cls:"totem", titre: tem.totem ? maj(tem.totem) : undefined })}
        <div class="noms"><h1 class="titre-joueur">${esc(maj(tem.nom))}</h1>
        <p class="qualif" style="--sous:${esc(M[sty.second]?.couleur || "var(--ink)")}">(${esc(sty.nom)})</p></div>
        ${emblemeSVG(sty.code, M[sty.second]?.couleur || dom.couleur, { cls:"totem embleme", titre: sty.embleme ? maj(sty.embleme) : undefined })}
      </div>
      <div class="entete-texte">
      ${complet ? "" : `<p class="sous-titre">Profil provisoire : ${nbRep} réponse${nbRep > 1 ? "s" : ""} sur 25</p>`}
      <p class="date">Questionnaire du ${new Date(r.passe_le).toLocaleDateString("fr-FR")}.${autre ? "" : ' <a href="questionnaire.html">Le modifier ou le refaire</a>. <a href="rosace.html">Voir ma place sur la rosace</a>.'}</p>
      </div>
    </div>

    <section><h2>Vos moteurs</h2><p class="question">Ce qui vous met en mouvement à la table, du plus fort au plus faible.</p>
      <div class="moteurs">${moteurs}</div></section>

    <section id="temperaments"><h2>${autre ? "Ses" : "Vos"} tempéraments</h2><p class="question">Ce que je cherche, ce que je fuis. Le premier est ${autre ? "son" : "votre"} tempérament ; les suivants, des facettes presque aussi marquées.${complet ? "" : " Facettes provisoires : elles se précisent avec les 25 réponses."}</p>
      ${facs.length > 1 ? `<div class="facettes" role="tablist">${facs.map((f, i) => `<button type="button" role="tab" class="facette" data-tem="${esc(f.code)}" aria-selected="${i === 0}">
        ${totemSVG(f.code, M[f.code[0]].couleur, { titre:"" })}<span><b>${esc(maj(TEMS[f.code]?.nom || f.code))}</b><small>${Math.round(f.part * 100)} %</small></span></button>`).join("")}</div>` : ""}
      <div id="tem-corps">${blocTemperament(tem.code)}</div></section>

    <section>${emblemeSVG(sty.code, M[sty.second].couleur, { cls:"s-embleme", titre: sty.embleme ? maj(sty.embleme) : undefined })}<h2>${autre ? "Son" : "Votre"} style : ${esc(sty.nom)}</h2><p class="question">Avec quoi je le vis : ${esc(dom.nom)}, conduit par ${esc(M[sty.second].nom)}.</p>
      ${sty.devise ? `<p class="devise">${esc(maj(sty.devise))}${sty.titre ? ` · « ${esc(sty.titre)} »` : ""}</p>` : ""}
      ${sty.texte ? `<p>${esc(sty.texte)}</p>` : ""}
      ${sty.embleme ? `<p class="devise">Son emblème : ${esc(sty.embleme)}. ${esc(sty.embleme_raison || "")}</p>` : ""}
      ${FB && sty.fb_verbe ? `<p class="fb">Dans Flamme Bleue : ${esc(sty.fb_verbe)} (« ${esc(sty.fb_devise)} »).</p>` : ""}</section>

    <details class="repli"><summary>${esc(dom.nom)} <small>votre moteur dominant, en entier</small></summary>
    <section><p class="question">Pourquoi je joue ? Votre tempérament en est une déclinaison.</p>
      <p class="devise">${esc(dom.devise)}${dom.citation ? ` · « ${esc(dom.citation)} »` : ""}</p>
      <p>${esc(dom.texte)}</p>
      ${dom.a_la_table ? `<span class="libelle">À la table, il peut</span>${puces(dom.a_la_table)}` : ""}</section></details>

    <!-- (3.18, 10/11/2026) « Votre moment » masqué ; la frise reste en commentaire plus bas, pour plus tard -->

    <section id="vos-jeux"><h2>${autre ? "Ses jeux" : "Vos jeux"}</h2><p class="question">Les jeux évalués dans PRISME, vus par ${autre ? "ce" : "votre"} style de joueur.</p>
      <div id="vos-jeux-corps"><p class="pj-discret">Calcul en cours…</p></div></section>

    ${tr ? `<section id="rival"><h2>${autre ? "Son" : "Votre"} rival</h2><p class="question">Son tempérament est l'inverse du ${autre ? "sien" : "vôtre"} : ce qui ${autre ? "le" : "vous"} fait décrocher le nourrit, et inversement.</p>
      <div class="rival">${totemSVG(rival, M[tr.moteur].couleur, { cls:"r-totem", titre: tr.totem ? maj(tr.totem) : undefined })}
        <div><p><b>${esc(maj(tr.nom))}</b> <small class="code">${esc(M[tr.moteur].nom)}, fuit ${esc(M[tr.fuit].nom.toLowerCase())}</small></p>
        <p>${esc(tr.qui_il_est)}</p></div></div>
      <h3>Quels jeux pour vous deux ?</h3>
      <div id="rival-jeux"><p class="pj-discret">Calcul en cours…</p></div></section>` : ""}`;
  afficherVosJeux(code, autre);
  document.querySelectorAll(".facette").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".facette").forEach(x => x.setAttribute("aria-selected", x === b));
    $("#tem-corps").innerHTML = blocTemperament(b.dataset.tem);
  }));
  if (TOTEMS.svg[tem.code]) $("#credit").innerHTML = TOTEMS_CREDIT;
  barreProfil(tem, sty, dom.couleur);
}
let TEMS = {}, MOT = {}, FB = false;
// (3.18) quand le cadre principal sort de l'écran, une barre fine garde le profil en vue (petit totem, tempérament, style) ;
// elle se place sous la barre collante d'entete.js (--ent-h, 0 sur téléphone) et respecte la zone sûre du haut
function barreProfil(tem, sty, couleur){
  const cadre = $(".entete"); if (!cadre || !window.IntersectionObserver) return;
  const b = document.createElement("div");
  b.className = "mini-profil"; b.setAttribute("aria-hidden", "true"); b.title = "Revenir en haut";
  b.innerHTML = `${totemSVG(tem.code, couleur, { titre:"" })}<span class="m-tem">${esc(maj(tem.nom))}</span><span class="m-sty">(${esc(sty.nom)})</span>`;
  b.addEventListener("click", () => scrollTo({ top:0, behavior:"smooth" }));
  document.body.appendChild(b);
  const entH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ent-h")) || 0;
  let obs, minuterie;
  const observer = () => {
    obs?.disconnect();
    obs = new IntersectionObserver(([e]) => b.classList.toggle("visible", !e.isIntersecting && e.boundingClientRect.top < entH() + 1),
      { rootMargin: `-${Math.round(entH())}px 0px 0px 0px` });
    obs.observe(cadre);
  };
  observer(); addEventListener("resize", () => { clearTimeout(minuterie); minuterie = setTimeout(observer, 150); });
}
function blocTemperament(code){
  const t = TEMS[code]; if (!t) return "";
  return `<h3>${esc(maj(t.nom))} <small class="code">${esc(MOT[t.moteur].nom)}, fuit ${esc(MOT[t.fuit].nom.toLowerCase())}</small></h3>
      <p>${esc(t.qui_il_est)}</p>
      <span class="libelle">À la table, il peut</span>${puces(t.a_la_table)}
      <p><span class="libelle">Quand il décroche</span>${esc(t.quand_decroche)}</p>
      ${t.totem ? `<p><span class="libelle">Son totem</span>${esc(maj(t.totem))}. ${esc(t.totem_raison || "")}</p>` : ""}
      ${FB && t.fb_verbe ? `<p class="fb">Dans Flamme Bleue : ${esc(t.fb_verbe)} (« ${esc(t.fb_devise)} »).</p>` : ""}`;
}
async function afficherVosJeux(code, autre){
  const box = $("#vos-jeux-corps"), d = await lireJeuxEvalues(sb), rj = $("#rival-jeux");
  if (d.refus){ box.innerHTML = `<p class="pj-discret">Les jeux évalués sont réservés aux membres de PRISME pour l'instant.</p>`; if (rj) rj.innerHTML = box.innerHTML; return; }
  // (3.16) toutes les sous-fiches, puis pour chaque jeu la version qui obtient la meilleure note pour ce profil (timeline.js 3.15)
  const T = jeuxPourJoueurs(d.fichesSousFiches || d.fiches, d.paires, d.axes, null, [code], d.src);
  box.innerHTML = tableJeuxHTML(meilleureVersion(T, d.jeux), d, autre ? "ce joueur" : "vous", false);
  if (!rj) return;
  // quels jeux pour vous deux : la note du rival est la moyenne de ses trois styles ; on classe selon la plus basse des deux notes
  // (3.16) la même version pour les deux, celle dont la plus basse des deux notes est la meilleure
  const rival = code[4].toUpperCase() + "/" + code[0].toLowerCase();
  const R2 = Object.fromEntries(jeuxPourJoueurs(d.fichesSousFiches || d.fiches, d.paires, d.axes, null, stylesDe(rival), d.src).map(x => [x.jeu, x]));
  const D = meilleureVersion(T.filter(x => R2[x.jeu]).map(x => ({ jeu:x.jeu, finale:x.finale, a:x.note, b:R2[x.jeu].note, n:Math.min(x.note, R2[x.jeu].note) })), d.jeux, "n");
  const nom = c => nomJeuGlobal(c, d.jeux), f = v => Number(v).toFixed(2).replace(".", ",");   // (3.15) sans « (all-in) »
  rj.innerHTML = D.length ? `<p class="pj-discret">Classés selon la note la plus basse des deux : le jeu qui ne laisse personne sur le bord.</p>
    <table class="pj-jeux"><thead><tr><th></th><th>Jeu</th><th class="n">${autre ? "Pour lui" : "Pour vous"}</th><th class="n">${autre ? "Pour son rival" : "Pour votre rival"}</th><th class="n">Ensemble</th></tr></thead><tbody>
    ${D.slice(0, 8).map((x, i) => `<tr><td class="rang">${i + 1}</td><td><a href="evaluation.html?jeu=${encodeURIComponent(x.jeu)}">${esc(nom(x.jeu))}</a>${mentionVersion(x)}${x.finale ? "" : ' <small class="pj-discret">brouillon</small>'}</td>
      <td class="n">${f(x.a)}</td><td class="n">${f(x.b)}</td><td class="n"><b>${f(x.n)}</b></td></tr>`).join("")}</tbody></table>`
    : `<p class="pj-discret">Aucun jeu n'a encore de fiche complète.</p>`;
}
