<style>
/* 1.0 (30/10/2026) : la maquette validée « Décrire le jeu » (faite sur Heat), avec les couleurs et les polices de la fiche du jeu
   1.1 (31/10/2026) : lisibilité, après le test sur Heat : « En bref », le thème avant les mécaniques, modes de jeu en trois lignes,
   mécanismes en trois colonnes, chaque axe titré par sa question avec le libellé de ses paliers
   1.4 (01/11/2026) : légendes en gras, aides en italique ; le matériel en coches dans « Le contenu et le matériel » ; demi-valeurs ;
   « Pour t'aider » sous cinq axes ; l'étendue (LIEN1d) calculée à partir du nombre de joueurs
   1.5 (02/11/2026) : les axes en trapèzes arrondis, utilisables au clavier ; pictogrammes des familles d'axes et du matériel ;
   le matériel en tuiles, en deux groupes, les sous-rubriques sous leur parent
   1.6 (05/11/2026) : une couleur par notion et le sommaire collant (selecteurs.js 1.4) ; le prix en trois colonnes ; le matériel d'abord,
   en arborescence de cases ; la liste complète des paliers à côté des trapèzes ; les codes des axes en info-bulle ; LIEN1d calculé en silence ;
   les onglets « Jeu de base » / « Jeu all-in » et « + Générer l'all-in »
   1.7 (05/11/2026) : « + Générer l'all-in » appelle prisme_generer_all_in avec son vrai paramètre, p_base
   1.8 (05/11/2026) : selecteurs.js 1.5 (sélecteurs lisibles, sujets en familles, « Niveau de réalisme »)
   1.9 (08/11/2026) : « Recopier depuis le jeu de base / all-in » (prisme_recopier_description), bloc par bloc ; selecteurs.js 1.7 :
   les info-bulles des mécanismes et des thèmes, et des info-bulles qui ne restent plus affichées (une seule à la fois, gérées par selecteurs.js)
   1.10 (08/11/2026) : le prix en douze tranches, quatre colonnes (une par groupe), la lettre et le montant ; le bandeau du jeu en tête
   du sommaire collant (selecteurs.js 1.8) */
:root{--ink:#15171C;--muted:#4B5160;--line:#E2E4E9;--trait:#C9CEDB;--paper:#F4F5F7;--panel:#FFFFFF;--neutre:#E8EAF0;--filet:#EEF0F4;
  --accent:#2346C8;--accent-fonce:#16308F;--sur-accent:#FFFFFF;--bleu-fond:#E6EBFB;--bleu-bord:#C9D3F5;--bleu-texte:#16308F;--orange-fond:#FBEDE4;--orange-texte:#8A3108;
  --vert-fond:#E7F4EC;--vert-texte:#14532D;--ok:#1E7A46;--warn:#B7791F;--err:#B42318;--trapeze:#F0F2F6;--trapeze-demi:#E3E6EE;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--ink:#E6E9EE;--muted:#A3ADBB;--line:#2C3542;--trait:#3A4555;--paper:#11161D;--panel:#171D25;--neutre:#252D38;--filet:#232B36;
  --accent:#7C9BFF;--accent-fonce:#A9BDFF;--sur-accent:#0B1020;--bleu-fond:#1F2A4D;--bleu-bord:#2E3D6B;--bleu-texte:#C9D6FF;--orange-fond:#3D2618;--orange-texte:#F5C3A3;
  --vert-fond:#16301F;--vert-texte:#A6E3BC;--ok:#5CC98A;--warn:#E0A84A;--err:#F2837A;--trapeze:#252D38;--trapeze-demi:#2E3744}}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important} body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)} a:hover{color:var(--accent-fonce)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.marque{font:600 19px/1 "Source Serif 4",Georgia,serif;letter-spacing:.08em;color:var(--ink)!important;text-decoration:none}
.barre{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)}
.barre a{text-decoration:none;color:var(--muted)} #qui a{margin-left:10px}
main{max-width:1080px;margin:0 auto;padding:8px 24px 120px;display:flex;flex-direction:column;gap:20px}
.retour{font-size:13.5px;color:var(--muted);text-decoration:none;align-self:flex-start} .retour:hover{text-decoration:underline}
#contenu{display:flex;flex-direction:column;gap:20px}
.vide{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;font:italic 18px/1.5 var(--serif);color:var(--muted);margin:0}
.discret{color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font:500 14px var(--sans);padding:0 18px;border-radius:8px;border:1px solid var(--trait);background:var(--panel);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.plein{background:var(--accent);border-color:var(--accent);color:var(--sur-accent);font-weight:600} .btn.plein:hover{background:var(--accent-fonce);border-color:var(--accent-fonce)}
.btn.contour{min-height:40px;padding:0 16px;border-color:var(--accent);color:var(--accent);font-weight:600} .btn.contour:hover{background:var(--bleu-fond)}
.btn:disabled{opacity:.5;cursor:default}
/* infobulle : au survol, au focus (clavier) et au toucher ; (1.9) ouverte et fermée par selecteurs.js 1.7 (classe bulle-ouverte), une seule à la fois */
.info{position:relative;cursor:default}
.info .bulle{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--ink);color:var(--panel);font:400 12.5px/1.45 var(--sans);padding:7px 10px;border-radius:8px;width:max-content;max-width:min(340px,80vw);white-space:normal;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.info.bulle-ouverte .bulle{display:block}

/* l'en-tête */
.tete{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.tete > div:first-child{display:flex;flex-direction:column;gap:6px}
.surtitre{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tete h1{margin:0;font:600 clamp(28px,4.5vw,36px)/1.1 var(--serif)}
.tete p{margin:0;color:var(--muted);font-size:14px}
.configs{display:flex;gap:4px;padding:4px;background:var(--neutre);border-radius:10px}
.configs a,.configs b{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none}
.configs b{background:var(--panel);color:var(--ink)} .configs a{color:var(--accent)}
.configs button{padding:8px 14px;border:1px dashed var(--accent);border-radius:8px;background:none;color:var(--accent);font:600 14px var(--sans);cursor:pointer}
.configs button:hover{background:var(--bleu-fond)} .configs button:disabled{opacity:.5;cursor:default}
/* (1.9) les onglets et, dessous, « Recopier depuis… » ; sa fenêtre : quatre cases, l'avertissement */
.tete-droite{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#dlg-recopier{width:min(520px,94vw)}
#dlg-recopier .case{align-items:flex-start;min-height:0;padding:6px 0} #dlg-recopier .case input{margin-top:2px}
#dlg-recopier .case span{display:flex;flex-direction:column} #dlg-recopier .case small{font-size:12.5px;font-style:italic;color:var(--muted)}
#dlg-recopier .avert{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--orange-fond);color:var(--orange-texte);font-size:14px}
#dlg-recopier .m-actions .m-etat.err{color:var(--err)}
/* le bandeau d'état */
.etat{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;font-size:14px;margin:0}
.etat.ok{background:var(--vert-fond);color:var(--vert-texte)} .etat.manque{background:var(--orange-fond);color:var(--orange-texte)}
.etat b{flex:none}
/* les blocs */
section.bloc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.bloc-tete{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.bloc-tete > div{display:flex;flex-direction:column;gap:4px}
.bloc h2{margin:0;font:600 21px/1.25 var(--sans)}
.bloc-tete p,.aide{margin:0;font-size:14px;font-style:italic;color:var(--muted)}
.aide.petite{font-size:13px}
.champs{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end}
.champ{display:flex;flex-direction:column;gap:6px} .champ > span:first-child,.etiquette{font-size:13px;font-weight:600;color:var(--ink)}
.champ > div{display:flex;align-items:center;gap:8px} .champ > div > span{color:var(--muted);font-size:13px}
.champ input[type=text],.champ input[type=number]{min-height:40px;padding:8px 12px;border:1px solid var(--trait);border-radius:8px;background:var(--panel);font-size:15px}
.champ input.n{width:90px} .champ input.n2{width:72px} .champ input.long{width:min(280px,80vw)}
.champ input:disabled,textarea:disabled{background:var(--paper);color:var(--ink)}
.case{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;cursor:pointer}
.case input{width:18px;height:18px;margin:0;cursor:pointer}
.case-aide{display:flex;flex-direction:column;max-width:320px} .case-aide .aide{margin-top:-4px}
.champ .aide{max-width:360px}
.champ input.faux{border-color:var(--err)}
/* (1.4) l'info-bulle « ⓘ » des exemples ; le matériel en simples coches, les sous-rubriques en retrait */
.i-aide{display:inline-block;margin-left:6px;color:var(--accent);font-weight:400;cursor:help} .i-aide .bulle{left:auto;right:0}
/* (1.6) le matériel en arborescence de cases (pictogramme + nom), en deux groupes côte à côte ; un parent coché déplie ses enfants, en retrait */
.materiel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;align-items:start}
.mat-colonne{display:flex;flex-direction:column;gap:2px}
.mat-groupe{font-size:13px;font-weight:700;color:var(--n-titre,var(--ink));padding:0 0 4px}
.mat-case{display:flex;align-items:center;gap:8px;min-height:36px;padding:2px 8px;margin-left:calc(var(--prof, 0) * 28px);border-radius:8px;font-size:14px;cursor:pointer}
.mat-case:hover{background:rgba(127,127,127,.08)}
.mat-case input{width:18px;height:18px;margin:0;flex:none;cursor:pointer}
.mat-case svg.picto{margin:0}
.mat-case:has(input:checked){font-weight:600} .mat-case:has(input:checked) svg.picto{color:var(--ink)}
.mat-case:has(input:disabled){cursor:default}
.mat-case.sous::before{content:"↳";color:var(--muted);margin-right:-2px}
.sous-bloc{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--n-bord,var(--filet));padding-top:14px}
/* le prix : (1.10) quatre colonnes, une par groupe, son titre en gras ; deux colonnes, puis une, sur écran étroit */
.tranches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.groupe-prix{display:flex;flex-direction:column;gap:8px}
.groupe-prix > span{font-size:13.5px;font-weight:700;color:var(--ink)}
@media (max-width:900px){ .tranches{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .tranches{grid-template-columns:minmax(0,1fr)} }
.tranche{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.tranche input{position:absolute;opacity:0;width:1px;height:1px}
.tranche small{font-size:12px;color:var(--muted);white-space:nowrap}
.tranche:has(input:checked){border:2px solid var(--accent);background:var(--bleu-fond);color:var(--bleu-texte);font-weight:600;padding:0 13px}
.tranche:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tranche:has(input:disabled){cursor:default}
/* les résumés de la mécanique et du thème */
.resume{display:flex;flex-direction:column;gap:10px}
.rang{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rang > .etiq{font-size:13px;font-weight:600;color:var(--ink);width:110px;flex:none}
.puce{display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--trait)}
.puce.mj{background:var(--bleu-fond);color:var(--bleu-texte);font-weight:600;border-color:var(--bleu-bord)}
.puce.mg{color:var(--muted);border-style:dashed;font-size:12px} .puce.gras{font-weight:600}
.rem{font-weight:400;opacity:.85}
.bas{font-size:13px;color:var(--muted)}
/* les mécanismes à poids : trois colonnes côte à côte, empilées sur téléphone */
.colonnes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.colonne{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--filet);border-radius:12px}
.colonne > .etiq{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.colonne .puces{display:flex;flex-wrap:wrap;gap:6px}
/* les axes descriptifs */
/* (1.5) chaque famille : son pictogramme dans un carré arrondi, son nom bien visible, sa phrase d'aide en italique */
.famille{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.famille > span:first-child{flex:none;width:40px;height:40px;border-radius:10px;background:var(--n-fort,var(--bleu-fond));color:var(--n-titre,var(--bleu-texte));display:flex;align-items:center;justify-content:center}
.famille svg.picto{margin:0;color:inherit}
.famille h3{margin:0;font:600 21px/1.2 var(--serif)}
.famille p{margin:0;font-size:13px;font-style:italic;color:var(--muted)}
/* (1.4) la question sur toute la largeur, le nom et le code à côté ; les cases dessous, avec les demi-valeurs en quinconce au-dessus */
/* (1.6) un fond alterné d'un axe à l'autre (blanc / pêche très pâle), un filet entre chaque axe, plus d'espace */
.axe{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:18px 14px;border-top:1px solid var(--n-bord,var(--filet))}
.axes-liste > .axe:nth-child(odd){background:var(--panel)} .axes-liste > .axe:last-child{border-bottom:1px solid var(--n-bord,var(--filet))}
.axe-gauche{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.axe.so .paliers{opacity:.35}
.axe-nom{min-width:0}
.axe-nom .nom{font-size:15px;font-weight:600;border-bottom:1px dotted var(--trait)}
.axe-code{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-left:8px;white-space:nowrap}
.aide-axe{margin:0;font-size:13px;font-style:italic;color:var(--muted)}
.axe-saisie{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start}
/* (1.5) les trapèzes arrondis : six grands (0 à 5) en bas, cinq petits (0,5 à 4,5) au-dessus, dans les creux ;
   chaque bouton occupe deux colonnes de --d ; le contour de la couleur du fond arrondit les angles */
.echelle{--d:22px;display:grid;grid-template-columns:repeat(12,var(--d));grid-template-rows:25px 35px;row-gap:1px;position:relative}
.echelle button{grid-column-end:span 2;width:100%;height:100%;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:6px}
.echelle button svg{display:block;width:100%;height:100%;overflow:visible}
.echelle polygon{fill:var(--trapeze);stroke:var(--trapeze);stroke-width:6;stroke-linejoin:round}
.echelle button.demi{color:var(--muted)} .echelle button.demi polygon{fill:var(--trapeze-demi);stroke:var(--trapeze-demi)}
.echelle text{fill:currentColor;font-family:var(--sans);font-weight:500}
.echelle button:not(:disabled):hover polygon{fill:var(--bleu-fond);stroke:var(--bleu-fond)}
.echelle button[aria-pressed=true]{color:var(--sur-accent)} .echelle button[aria-pressed=true] text{font-weight:700}
.echelle button[aria-pressed=true] polygon{fill:var(--accent);stroke:var(--accent)}
.echelle button:disabled{cursor:default}
/* le libellé de chaque palier : en info-bulle au-dessus des cases (ancrée sur l'échelle, pour ne pas sortir de l'écran), et sous les cases pour la valeur choisie */
.echelle button.info{position:static}
.echelle button .bulle{top:auto;bottom:calc(100% + 6px);font-weight:400;max-width:min(260px,80vw)}
.palier{flex-basis:100%;font-size:13px;font-style:italic;color:var(--muted)} .palier:empty{display:none}
.so-lab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.so-lab input{width:16px;height:16px;margin:0}
.axe.so .echelle{opacity:.35}
details.com{grid-column:1 / -1}
details.com > summary{font-size:12.5px;color:var(--muted);cursor:pointer;width:max-content}
details.com textarea{display:block;width:100%;margin-top:6px;padding:7px 10px;border:1px solid var(--trait);border-radius:8px;background:var(--panel);font-size:14px;resize:vertical}
/* la barre d'enregistrement, fixée en bas */
.enr{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 24px;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center}
.enr > div{max-width:1080px;width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}
.enr .infos{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
#enr-etat{font-size:13px} #enr-etat.err{color:var(--err)} #enr-etat.ok{color:var(--ok)}
.enr .boutons{display:flex;gap:8px}
.version{font-size:12px;color:var(--muted);text-align:right;margin:0}
@media (max-width:760px){
  main{padding:8px 12px 150px;gap:16px} #contenu{gap:16px}
  section.bloc{padding:18px}
  .champs{gap:16px 20px}
  .rang > .etiq{width:100%}
  .colonnes{grid-template-columns:1fr}
  .echelle{--d:24px}
  .materiel{grid-template-columns:minmax(0,1fr)} .mat-case{margin-left:calc(var(--prof, 0) * 18px)}
  .axe{padding:14px 10px}
  .enr{padding:10px 12px} .enr .boutons{flex:1} .enr .boutons .btn{flex:1}
}
</style>

function afficherCompte(u){
  $("#qui").innerHTML = u ? `<span>${esc(u.email)}</span> <a href="#" id="deconnexion">Se déconnecter</a>` : `<a href="${versForge()}">Se connecter</a>`;
  const d = $("#deconnexion"); if (d) d.addEventListener("click", e => { e.preventDefault(); sb.auth.signOut().then(() => location.href = "../"); });
}
let demarre = false;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session?.user){ location.replace(versForge()); return; }
  afficherCompte(session.user);
  if (!demarre){ demarre = true; setTimeout(() => afficher(session.user), 0); }
});
const vide = html => $("#contenu").innerHTML = `<p class="vide">${html}</p>`;
const NIVEAUX = { joueur:0, lecteur:1, evaluateur:2, editeur:3, proprietaire:4 };

/* ---- le modèle de la page : un seul endroit pour changer un mot ---- */
// (1.10) les douze gammes de prix, en quatre groupes de trois : GROUPES_PRIX et montantPrix() dans selecteurs.js ; montants dans prisme_reglages
// (1.4) « Pour t'aider » : ce que la description dit déjà, lu en direct, sous cinq axes
const DECLENCHES = ["ECO-06", "ECO-12", "ECO-14", "INC-09", "INC-12", "STR-28", "TOUR-05", "TOUR-09"];   // les mécanismes que le jeu déclenche lui-même (MECA1b)
const minus = L => L.map(l => (l.nom || l.libelle).toLowerCase()).join(", ");
const affectesNiveau = n => M.lignes.filter(l => l.niveau === n && M.affectes[l.code]);
const AIDES = {
  MECA1a: () => affectesNiveau("hasard").map(l => `${l.nom.toLowerCase()} (${POIDS[M.affectes[l.code].poids]})`).join(", ") || "aucun hasard décrit",
  MECA1b: () => minus(M.lignes.filter(l => DECLENCHES.includes(l.code) && M.affectes[l.code])) || "aucun",
  THEM1: () => TH.affectes[ABSTRAIT] ? "abstrait" : [["sujet", affectesDe("sujet")], [FACETTES.role.toLowerCase(), affectesDe("role")]]
    .filter(([, L]) => L.length).map(([t, L]) => `${t} : ${minus(L)}`).join(" ; ") || "aucun thème décrit",
  LIEN1: () => minus(affectesNiveau("aspect").filter(l => l.sous_groupe === "contre_qui")) || "aucun mode de jeu décrit",
  LIEN1c: () => minus(affectesNiveau("parole")) || "aucun" };
const texteAide = c => `Pour t'aider : ${D.errMeca || D.errThemes ? "la description n'a pas pu être lue" : AIDES[c]()}.`;
// (1.4) l'étendue (LIEN1d) ne se saisit plus : elle se calcule à partir du nombre de joueurs d'« En bref »
const CALCULE = "LIEN1d";
function etendue(min, max){
  if (!Number.isInteger(min) || !Number.isInteger(max) || max < min) return null;
  const n = max - min + 1;   // le nombre d'effectifs possibles
  return n <= 1 ? 0 : n === 2 ? 1 : n <= 4 ? 2 : n <= 6 ? 3 : n <= 9 ? 4 : 5;
}
const CONFIGS = { base:"Jeu de base", all_in:"Jeu all-in" };
// (1.5) la phrase d'aide de chaque famille d'axes (code du chapitre) ; le pictogramme est dans PICTOS (selecteurs.js)
const FAMILLES = { SYS:"Comment le jeu fonctionne", EXP:"Ce que le jeu fait vivre", EDI:"Ce que la boîte contient" };
// (1.1) suggestions pour la nature des contenus (champ libre)
const NATURES = ["scénarios", "circuits", "plateaux", "factions", "personnages", "missions"];
const D = { code:null, user:null, ecrit:false, jeu:null, freres:[], chapitres:[], axes:[], paliers:{}, prix:{}, noms:{}, desc:null, F0:null, A:{}, A0:{}, derniere:null, mat:new Set(), mat0:new Set() };

async function afficher(user){
  const code = new URLSearchParams(location.search).get("jeu");
  if (!code) return vide('Aucun jeu choisi. <a href="jeux.html">Voir tous les jeux</a>.');
  Object.assign(D, { code, user });
  const [{ data: r }, j, ch, pa, ax, rg, nm, pl] = await Promise.all([
    sb.rpc("prisme_mon_role"),
    sb.from("prisme_jeux").select("code,nom,configuration,fiche_globale,image_url").eq("code", code).maybeSingle(),
    sb.from("prisme_chapitres").select("code,nom,ordre").order("ordre"),
    sb.from("prisme_paires").select("code,chapitre,ordre").order("ordre"),
    sb.from("prisme_axes").select("code,paire,rang,nom,question,definition,ordre").order("ordre"),
    sb.from("prisme_reglages").select("cle,valeur"),
    sb.rpc("prisme_noms"),
    sb.from("prisme_paliers").select("axe,valeur,libelle")]);
  if (j.error) return vide("Le jeu n'a pas pu être lu : " + esc(j.error.message));
  if (!j.data) return vide('Ce jeu n\'existe pas. <a href="jeux.html">Voir tous les jeux</a>.');
  D.jeu = j.data; D.role = r || "joueur"; D.ecrit = NIVEAUX[D.role] >= NIVEAUX.evaluateur;
  document.title = `PRISME — Décrire le jeu — ${D.jeu.nom}`;
  $("#retour").href = "jeu.html?jeu=" + encodeURIComponent(code); $("#retour").textContent = "← La fiche du jeu";
  (nm.data || []).forEach(x => D.noms[x.user_id] = x.nom);
  // les libellés des paliers, par axe et par valeur ; sans eux, les cases restent muettes
  if (pl.error) console.warn("PRISME : paliers illisibles", pl.error.message);
  (pl.data || []).forEach(x => (D.paliers[x.axe] ||= {})[Number(x.valeur)] = x.libelle);
  (rg.data || []).forEach(x => { if (/^prix_[A-K]_max$/.test(x.cle)) D.prix[x.cle] = x.valeur; });   // (1.10) les montants, lus par montantPrix()
  // les axes descriptifs (« note 1 » : rang 1, 1b, 1c, 1d), par chapitre puis dans l'ordre des paires et des axes
  const paire = Object.fromEntries((pa.data || []).map(p => [p.code, p]));
  D.chapitres = ch.data || [];
  const ordreCh = c => D.chapitres.find(x => x.code === c)?.ordre ?? 99;
  D.axes = (ax.data || []).filter(a => /^1/.test(a.rang || "") && paire[a.paire]).map(a => ({ ...a, chap: paire[a.paire].chapitre }))
    .sort((a, b) => ordreCh(a.chap) - ordreCh(b.chap) || paire[a.paire].ordre - paire[b.paire].ordre || a.ordre - b.ordre);
  // les sous-fiches de la même fiche globale (jeu de base, all-in)
  if (D.jeu.fiche_globale){
    const { data: fr } = await sb.from("prisme_jeux").select("code,nom,configuration").eq("fiche_globale", D.jeu.fiche_globale);
    D.freres = (fr || []).sort((a, b) => (a.configuration === "base" ? 0 : 1) - (b.configuration === "base" ? 0 : 1));
  }
  const [err] = await Promise.all([lireDescription(), lireMecanismes(code, user, r || "joueur").then(e => D.errMeca = e), lireThemes(code, user, r || "joueur").then(e => D.errThemes = e)]);
  if (err) return vide("La description n'a pas pu être lue : " + esc(err));
  // après un enregistrement dans un sélecteur : les résumés, le matériel et les aides des axes suivent
  M.apres = e => { D.errMeca = e; lireMateriel(); dessinerMateriel(); resumeMeca(); bandeau(); majAides(); };
  TH.apres = e => { D.errThemes = e; resumeThemes(); majAides(); };
  lireMateriel();
  dessiner();
}

// la ligne de description et ses axes ; une sous-fiche sans description s'ouvre vide
async function lireDescription(){
  const [d, a] = await Promise.all([
    sb.from("prisme_descriptions").select("*").eq("jeu", D.code).maybeSingle(),
    sb.from("prisme_descriptions_axes").select("axe,valeur,sans_objet,commentaire,modifie_le,modifie_par").eq("jeu", D.code)]);
  if (d.error || a.error) return (d.error || a.error).message;
  D.desc = d.data || null;
  const lus = Object.fromEntries((a.data || []).map(x => [x.axe, x]));
  D.A = Object.fromEntries(D.axes.map(x => { const v = lus[x.code];
    return [x.code, { valeur: v?.valeur == null ? null : Number(v.valeur), sans_objet: !!v?.sans_objet, commentaire: v?.commentaire || "" }]; }));
  D.A0 = JSON.parse(JSON.stringify(D.A));
  // la dernière modification : la ligne de description ou l'un de ses axes
  D.derniere = [D.desc, ...(a.data || [])].filter(x => x?.modifie_le).sort((x, y) => new Date(y.modifie_le) - new Date(x.modifie_le))[0] || null;
  return null;
}

/* ---- la page ---- */
function dessiner(){
  const ro = D.ecrit ? "" : " disabled", d = D.desc || {};
  const val = k => d[k] == null ? "" : virgule(d[k]);
  const champ = (k, titre, cls = "n", mode = "numeric") => `<label class="champ"><span>${esc(titre)}</span><div><input type="text" inputmode="${mode}" class="${cls}" id="f-${k}" value="${esc(val(k))}"${ro}></div></label>`;
  const deux = (a, b, titre, unite) => `<div class="champ"><span>${esc(titre)}</span><div><input type="text" inputmode="numeric" class="n2" id="f-${a}" value="${esc(val(a))}" aria-label="${esc(titre)} : minimum"${ro}><span>à</span><input type="text" inputmode="numeric" class="n2" id="f-${b}" value="${esc(val(b))}" aria-label="${esc(titre)} : maximum"${ro}>${unite ? `<span>${unite}</span>` : ""}</div></div>`;
  const tete = (titre, sous, bouton) => `<div class="bloc-tete"><div><h2 class="n-titre">${titre}</h2><p>${sous}</p></div>${bouton || ""}</div>`;
  const nomCfg = c => CONFIGS[c] || c || "Jeu de base";
  // (1.6) deux onglets, « Jeu de base » et « Jeu all-in » ; sans all-in, l'onglet est un bouton qui le génère (éditeur et propriétaire)
  const S = D.freres.length ? D.freres : [D.jeu], estAllIn = f => f.configuration === "all_in";
  const base = S.find(f => !estAllIn(f) && (f.configuration || "base") === "base"), allin = S.find(estAllIn);
  const onglet = f => f.code === D.code ? `<b aria-current="page">${esc(nomCfg(f.configuration))}</b>` : `<a href="decrire.html?jeu=${encodeURIComponent(f.code)}">${esc(nomCfg(f.configuration))}</a>`;
  const onglets = [base && onglet(base), allin ? onglet(allin) : base && base.code === D.code && NIVEAUX[D.role] >= NIVEAUX.editeur
      ? `<button type="button" id="generer-allin" title="Créer la sous-fiche « Jeu all-in » à partir de ce jeu de base">+ Générer l'all-in</button>` : "",
    ...S.filter(f => f !== base && f !== allin).map(onglet)].filter(Boolean);
  // (1.9) « Recopier depuis le jeu de base » (ou « … all-in ») : quand le jeu a les deux sous-fiches, pour l'éditeur et le propriétaire
  D.source = base && allin ? (D.code === allin.code ? base : D.code === base.code ? allin : null) : null;
  const recopier = D.source && NIVEAUX[D.role] >= NIVEAUX.editeur
    ? `<button type="button" class="btn contour" id="recopier" title="Remplacer ici des blocs de la description par ceux de l'autre sous-fiche">Recopier depuis le ${esc(nomCfg(D.source.configuration).toLowerCase())}</button>` : "";
  const configs = `<div class="tete-droite"><nav class="configs" aria-label="Sous-fiches">${onglets.join("") || `<b>${esc(nomCfg(D.jeu.configuration))}</b>`}</nav>${recopier}</div>`;
  // (1.10) une colonne par groupe, son nom en titre ; chaque tranche : sa lettre et son montant (« G · ≤ 200 € »)
  const prix = GROUPES_PRIX.map(([g, L]) => `<div class="groupe-prix"><span>${esc(g.charAt(0).toUpperCase() + g.slice(1))}</span>${[...L].map(l =>
    `<label class="tranche"><input type="radio" name="prix" value="${l}"${d.prix_gamme === l ? " checked" : ""}${ro}><span>${esc([l, montantPrix(l, D.prix, true)].filter(Boolean).join(" · "))}</span></label>`).join("")}</div>`).join("");
  if (D.A[CALCULE]) D.A[CALCULE].valeur = etendue(d.joueurs_min, d.joueurs_max);   // (1.4) l'étendue suit le nombre de joueurs enregistré
  // (1.6) l'étendue (LIEN1d) n'apparaît plus : elle reste calculée et enregistrée en silence
  const axes = D.chapitres.map(c => { const L = D.axes.filter(a => a.chap === c.code && a.code !== CALCULE); if (!L.length) return "";
    return `<div class="chapitre"><div class="famille"><span>${picto(c.code, 24)}</span><div><h3 class="n-titre">${esc(c.nom)}</h3>${FAMILLES[c.code] ? `<p>${esc(FAMILLES[c.code])}</p>` : ""}</div></div><div class="axes-liste">${L.map(ligneAxe).join("")}</div></div>`; }).join("");

  $("#contenu").innerHTML = `
    <div class="tete"><div><div class="surtitre">Décrire le jeu</div><h1>${esc(D.jeu.nom)}</h1>
      <p>Une description partagée : ce qui est vrai du jeu, quel que soit l'avis de chacun.</p></div>${configs}</div>
    <p class="etat" id="etat" role="status"></p>
    <section class="bloc ${notion("bref")}" id="c-bref">${tete("En bref", "Ce qu'on lit sur la boîte et dans la règle.")}
      <div class="champs">${champ("pages", "Pages de règles")}${champ("poids_bgg", "Poids BGG", "n", "decimal")}${deux("joueurs_min", "joueurs_max", "Joueurs")}${deux("duree_min", "duree_max", "Durée", "min")}
        <div class="case-aide"><label class="case"><input type="checkbox" id="f-usage_unique"${d.usage_unique ? " checked" : ""}${ro}> Usage unique</label>
          <span class="aide petite">Le jeu ne se rejoue pas tel quel : escape game, legacy, campagne qui se consomme…</span></div></div></section>
    <section class="bloc ${notion("prix")}" id="c-prix">${tete("Le prix", "Une gamme plutôt qu'un prix : elle dit quel achat c'est, et ne vieillit pas.")}
      <div class="tranches" role="radiogroup" aria-label="Gamme de prix">${prix}</div>
      <p class="aide petite">Les seuils de chaque tranche s'ajustent dans les réglages de la console ; les catégories, elles, ne changent pas.</p></section>
    <section class="bloc ${notion("contenu")}" id="c-contenu">${tete("Le contenu et le matériel", "Ce qu'il y a dans la boîte, et ce qu'il y a à découvrir d'une partie à l'autre.")}
      <span class="etiquette">Le matériel</span>
      <p class="aide petite" style="margin-top:-10px">Les mêmes coches que dans les mécaniques : cocher ici ou là revient au même. Une rubrique cochée déplie ses sous-rubriques.</p>
      <div class="materiel" id="materiel" role="group" aria-label="Le matériel du jeu"></div>
      <p class="aide petite">Le rôle compte, pas la forme : un pion représente un acteur, un jeton une quantité, un marqueur une position. Un cube peut être un jeton ou un marqueur.</p>
      <div class="sous-bloc"><div class="champs" style="gap:12px 16px">
        <div class="champ"><span><label for="f-contenus_nombre">Combien de scénarios, circuits, missions ou plateaux distincts ?</label><span class="info i-aide" tabindex="0" aria-label="Exemples : Heat, 4 circuits ; Gloomhaven, 95 scénarios">ⓘ<span class="bulle" aria-hidden="true">Heat : 4 circuits. Gloomhaven : 95 scénarios.</span></span></span>
          <div><input type="text" inputmode="numeric" class="n" id="f-contenus_nombre" value="${esc(val("contenus_nombre"))}"${ro}></div>
          <span class="aide petite">Laisse vide s'il n'y en a pas.</span></div>
        <label class="champ"><span>De quelle nature</span><div><input type="text" class="long" id="f-contenus_nature" list="natures" value="${esc(val("contenus_nature"))}"${ro}></div></label>
        <datalist id="natures">${NATURES.map(n => `<option value="${esc(n)}">`).join("")}</datalist></div>
      <p class="aide petite" style="max-width:520px">Avec la complexité et la variabilité (mise en place variable), ce nombre servira à calculer les parties pour tout exploiter.</p></div></section>
    <section class="bloc ${notion("theme")}" id="c-theme">${tete("Le thème", "PRISMEthemes : de quoi parle le jeu.", D.ecrit ? `<button class="btn contour" type="button" id="modifier-themes">Modifier les thèmes</button>` : "")}
      <div class="resume" id="res-themes"></div></section>
    <section class="bloc ${notion("meca")}" id="c-meca">${tete("Les mécaniques", "PRISMEmechanics : de quoi le jeu est fait.", D.ecrit ? `<button class="btn contour" type="button" id="modifier-meca">Modifier les mécanismes</button>` : "")}
      <div class="resume" id="res-meca"></div></section>
    <section class="bloc ${notion("axes")}" id="c-axes">${tete("Les axes descriptifs", "Les « note 1 » de PRISMEgame : décrire, sans juger. C'est ici, et seulement ici, qu'un axe se dit sans objet pour ce jeu.")}
      <div style="display:flex;flex-direction:column;gap:20px">${axes || `<p class="discret">Les axes descriptifs n'ont pas pu être lus.</p>`}</div></section>`;
  // (1.6) le sommaire collant : une pastille par cadre, dans sa couleur
  $("#sommaire").hidden = false;
  sommaire($("#sommaire"), [["c-bref", "En bref", "bref"], ["c-prix", "Le prix", "prix"], ["c-contenu", "Le contenu et le matériel", "contenu"],
    ["c-theme", "Le thème", "theme"], ["c-meca", "Les mécaniques", "meca"], ["c-axes", "Les axes", "axes"]].map(([id, nom, n]) => ({ id, nom, notion:n })),
    // (1.10) en tête, le bandeau du jeu : le nom de la base, la sous-fiche affichée
    { image:D.jeu.image_url, nom:(D.freres.find(f => (f.configuration || "base") === "base") || D.jeu).nom, sousFiche: D.jeu.configuration === "all_in" ? "jeu all-in" : "jeu de base" });
  $("#generer-allin")?.addEventListener("click", genererAllIn);
  $("#recopier")?.addEventListener("click", ouvrirRecopier);
  $("#modifier-meca")?.addEventListener("click", () => { if (D.errMeca) return;
    // (1.4) le sélecteur part de ce qui est enregistré : le matériel coché ici doit l'être d'abord
    if (materielModifie()){ const e = $("#enr-etat"); e.className = "err"; e.textContent = "Enregistre d'abord le matériel coché (ou annule), puis modifie les mécanismes."; return; }
    ouvrirSelecteur(); });
  $("#modifier-themes")?.addEventListener("click", () => { if (!D.errThemes) ouvrirSelecteurThemes(); });
  dessinerMateriel(); resumeMeca(); resumeThemes(); bandeau();
  D.F0 = JSON.stringify(lireFaits());
  // la barre du bas : en lecture seule, la date seulement
  $("#enr").hidden = false; $("#enr-boutons").hidden = !D.ecrit;
  $("#enr-modif").textContent = texteDerniere() + (D.ecrit ? "" : " · lecture seule");
  $("#enr-etat").textContent = ""; $("#enr-etat").className = "";
}

// une ligne d'axe : la valeur pré-remplie s'affiche arrondie à la demie la plus proche, et n'est réécrite que si on la change
const VALEURS = [0, .5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
function ligneAxe(a){
  const v = D.A[a.code], so = v.sans_objet, calc = a.code === CALCULE, ro = D.ecrit && !calc ? "" : " disabled";
  const r = v.valeur == null ? null : Math.round(v.valeur * 2) / 2;
  // (1.4) la question sur toute la largeur, le nom et le code à côté ; la définition en info-bulle
  const lu = so ? "sans objet" : v.valeur == null ? "—" : virgule(v.valeur), P = D.paliers[a.code] || {};
  // le libellé d'un palier ; une demi-valeur se dit « entre » ses deux voisins (selecteurs.js 1.4)
  const libelle = x => libelleDePalier(P, x);
  // (1.5) les six grands trapèzes sur la seconde ligne (petit côté en haut) ; les cinq petits au-dessus (grand côté en haut), chacun entre ses deux voisins.
  // Un seul bouton de l'échelle dans l'ordre de tabulation (la valeur choisie, sinon 0) : les flèches font le reste, demi-pas par demi-pas
  const tab = r ?? 0;
  const forme = x => x % 1 !== 0
    ? `<svg viewBox="0 0 44 25" aria-hidden="true"><polygon points="4,4 40,4 31.5,21 12.5,21"/><text x="22" y="15" text-anchor="middle" font-size="10.5">${virgule(x)}</text></svg>`
    : `<svg viewBox="0 0 44 35" aria-hidden="true"><polygon points="12.5,4 31.5,4 40,31 4,31"/><text x="22" y="26" text-anchor="middle" font-size="15">${x}</text></svg>`;
  const bouton = x => { const demi = x % 1 !== 0;
    return `<button type="button" data-v="${x}" class="info${demi ? " demi" : ""}" style="grid-row:${demi ? 1 : 2};grid-column-start:${2 * x + 1}" aria-pressed="${r === x}" aria-label="${virgule(x)} sur 5" tabindex="${x === tab ? 0 : -1}"${ro}>${forme(x)}${libelle(x) ? `<span class="bulle" aria-hidden="true">${esc(libelle(x))}</span>` : ""}</button>`; };
  const aide = calc ? `<p class="aide-axe">Calculé à partir du nombre de joueurs${v.valeur == null ? " (à remplir dans « En bref »)" : ""}.</p>`
    : AIDES[a.code] ? `<p class="aide-axe" data-aide="${esc(a.code)}">${esc(texteAide(a.code))}</p>` : "";
  const com = D.ecrit || v.commentaire ? `<details class="com"${v.commentaire ? " open" : ""}><summary>Commentaire</summary><textarea data-com rows="2" placeholder="Facultatif" aria-label="Commentaire sur ${esc(a.nom)}"${D.ecrit ? "" : " disabled"}>${esc(v.commentaire)}</textarea></details>` : "";
  // (1.6) le code de l'axe ne s'affiche plus : il reste dans l'info-bulle de la question ; à côté des trapèzes, tous les paliers de l'axe
  return `<div class="axe${so ? " so" : ""}" data-axe="${esc(a.code)}">
    <div class="axe-nom"><span class="nom info" tabindex="0">${esc(a.question || a.nom)}<span class="bulle">${a.definition ? `${esc(a.definition)}<br>` : ""}<i>${esc(a.code)}</i></span></span><span class="axe-code">${esc(a.nom)} · ${lu}</span></div>
    ${aide}
    <div class="axe-saisie"><div class="axe-gauche"><div class="echelle" role="group" aria-label="${esc(a.nom)}, de 0 à 5${calc ? ", calculé" : ""}">${VALEURS.map(bouton).join("")}</div>
      ${calc ? "" : `<label class="so-lab"><input type="checkbox" data-so${so ? " checked" : ""}${ro}> sans objet</label>`}</div>
      ${listePaliers(P, so ? null : r, virgule, ro)}</div>
    ${com}</div>`;
}
const majAides = () => document.querySelectorAll("[data-aide]").forEach(el => el.textContent = texteAide(el.dataset.aide));
function redessinerAxe(code){
  const el = document.querySelector(`.axe[data-axe="${CSS.escape(code)}"]`), a = D.axes.find(x => x.code === code);
  if (!el) return null;   // (1.6) l'étendue (LIEN1d) n'est plus affichée
  const ouvert = el.querySelector("details.com")?.open;
  el.outerHTML = ligneAxe(a);
  const neuf = document.querySelector(`.axe[data-axe="${CSS.escape(code)}"]`), det = neuf.querySelector("details.com"); if (det && ouvert) det.open = true;
  return neuf;
}
$("#contenu").addEventListener("click", e => {
  // (1.6) un palier de la liste choisit sa valeur, comme son trapèze
  const b = e.target.closest(".echelle button, .paliers button"); if (!b || !D.ecrit || b.disabled) return;
  const code = b.closest(".axe").dataset.axe, v = D.A[code], n = +b.dataset.v;
  v.valeur = v.valeur === n ? null : n;   // un second clic sur la valeur choisie l'efface
  redessinerAxe(code).querySelector(`.echelle button[data-v="${n}"]`)?.focus();
  changement();
});
// (1.5) au clavier : flèche gauche ou droite, la demi-valeur voisine est choisie
$("#contenu").addEventListener("keydown", e => {
  const b = e.target.closest(".echelle button"); if (!b || !D.ecrit || b.disabled || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const code = b.closest(".axe").dataset.axe, n = Math.min(5, Math.max(0, +b.dataset.v + (e.key === "ArrowRight" ? .5 : -.5)));
  D.A[code].valeur = n;
  redessinerAxe(code).querySelector(`.echelle button[data-v="${n}"]`)?.focus();
  changement();
});
$("#contenu").addEventListener("change", e => {
  if (e.target.matches("[data-so]")){ const code = e.target.closest(".axe").dataset.axe; D.A[code].sans_objet = e.target.checked; redessinerAxe(code).querySelector("[data-so]").focus(); }
  // (1.4) une coche du matériel peut faire apparaître ou disparaître ses sous-rubriques : on redessine la liste, sans perdre le focus
  if (e.target.matches("[data-mat]")){ const c = e.target.dataset.mat; e.target.checked ? D.mat.add(c) : D.mat.delete(c);
    dessinerMateriel(); document.querySelector(`[data-mat="${CSS.escape(c)}"]`)?.focus(); }
  changement();
});
$("#contenu").addEventListener("input", e => {
  if (e.target.matches("[data-com]")) D.A[e.target.closest(".axe").dataset.axe].commentaire = e.target.value;
  if (e.target.closest(".champ")) document.querySelectorAll(".champ .faux").forEach(x => x.classList.remove("faux"));
  // (1.4) l'étendue suit le nombre de joueurs en direct
  if (e.target.matches("#f-joueurs_min, #f-joueurs_max") && D.A[CALCULE]){
    const f = lireFaits(); D.A[CALCULE].valeur = etendue(f.joueurs_min, f.joueurs_max); redessinerAxe(CALCULE); }
  changement();
});

// (1.4) le matériel en simples coches : les mêmes lignes que l'étape 1 du sélecteur (poids 2 dans prisme_jeux_mecanismes)
function lireMateriel(){ D.mat0 = new Set(Object.keys(M.affectes).filter(c => ligneMeca(c)?.niveau === "materiel")); D.mat = new Set(D.mat0); }
const materielModifie = () => D.mat.size !== D.mat0.size || [...D.mat].some(c => !D.mat0.has(c));
function dessinerMateriel(){
  const el = $("#materiel"); if (!el) return;
  if (D.errMeca){ el.innerHTML = `<p class="discret" style="margin:0">Le matériel n'a pas pu être lu.</p>`; return; }
  // proposé : tout sauf écarté ou fusionné ; une ligne déjà cochée reste proposée pour pouvoir la décocher
  const L = M.lignes.filter(l => l.niveau === "materiel" && (D.mat.has(l.code) || M.affectes[l.code] || (l.statut !== "ecarter" && l.statut !== "fusionner")));
  const parentDe = l => (M.requis[l.code] || []).find(r => L.some(m => m.code === r));
  const ro = D.ecrit ? "" : " disabled";
  // (1.6) une case par élément : pictogramme, nom, définition au survol ou au focus ;
  // un parent coché déplie ses enfants, en retrait sous lui (une sous-rubrique cochée reste visible)
  const ligne = (l, prof) => `<label class="mat-case info${prof ? " sous" : ""}" style="--prof:${prof}"><input type="checkbox" data-mat="${esc(l.code)}"${D.mat.has(l.code) ? " checked" : ""}${ro}>${picto(l.code, 20)}<span>${esc(l.nom)}</span>${l.definition ? `<span class="bulle" aria-hidden="true">${esc(l.definition)}</span>` : ""}</label>`;
  const arbre = (G, prof, parent) => prof > 4 ? "" : G.map(l => {
    const vu = !parent || D.mat.has(l.code) || D.mat.has(parent);
    return (vu ? ligne(l, prof) : "") + arbre(rangerSous(L.filter(x => parentDe(x) === l.code)), prof + 1, l.code);
  }).join("");
  el.innerHTML = rangerMateriel(L.filter(l => !parentDe(l))).map(([t, G]) => `<div class="mat-colonne"><div class="mat-groupe">${esc(t)}</div>${arbre(G, 0, null)}</div>`).join("")
    || `<p class="discret" style="margin:0">Aucun matériel dans la nomenclature.</p>`;
}

// le bandeau : la même règle que le blocage de publication dans evaluation.html
function bandeau(){
  const el = $("#etat"); if (!el) return;
  if (D.errMeca){ el.className = "etat manque"; el.innerHTML = `<b>!</b> <span>Les mécanismes n'ont pas pu être lus : l'état de la description est inconnu.</span>`; return; }
  const L = Object.entries(M.affectes).map(([c, v]) => ({ niveau: ligneMeca(c)?.niveau, poids: v.poids })), a = n => L.some(x => x.niveau === n);
  const manque = [!a("materiel") && "le matériel", !a("aspect") && "le mode de jeu", !a("fin_de_partie") && "la fin de partie",
    !L.some(x => (x.niveau === "mecanisme" || x.niveau === "assemblage") && x.poids === 3) && "un mécanisme ou une combinaison majeur"].filter(Boolean);
  el.className = "etat " + (manque.length ? "manque" : "ok");
  el.innerHTML = manque.length ? `<b>!</b> <span>Description à compléter avant de publier la fiche finale : il manque ${esc(manque.join(", ").replace(/, ([^,]*)$/, " et $1"))}.</span>`
    : `<b>✓</b> <span>Description complète : la fiche finale peut être publiée.</span>`;
}

// les résumés : les modes de jeu en trois lignes, la fin de partie, les mécanismes en trois colonnes par poids, puis les gestes en petit (le matériel est dans « Le contenu et le matériel »)
const puceMeca = (l, cls) => `<span class="puce ${cls} info" tabindex="0">${esc(l.nom)}${remVisible(M.affectes[l.code]?.remarque)}<span class="bulle">${l.nom_en ? `<i>${esc(l.nom_en)}</i><br>` : ""}${esc(l.definition || "Pas encore de définition.")}</span></span>`;
const rang = (t, html) => `<div class="rang"><span class="etiq">${esc(t)}</span>${html}</div>`;
function resumeMeca(){
  const el = $("#res-meca"); if (!el) return;
  if (D.errMeca){ el.innerHTML = `<p class="discret" style="margin:0">Les mécanismes n'ont pas pu être lus (${esc(D.errMeca)}).</p>`; return; }
  const du = n => M.lignes.filter(l => l.niveau === n && M.affectes[l.code]);
  const rangs = [...parSousGroupe(du("aspect")), ["Fin de partie", du("fin_de_partie")]]
    .filter(([, L]) => L.length).map(([t, L]) => rang(t, L.map(l => puceMeca(l, "")).join("")));
  const P = [["Majeurs", parPoids(3), "mj"], ["Secondaires", parPoids(2), ""], ["Marginaux", parPoids(1), "mg"]];
  const colonnes = P.some(([, L]) => L.length) ? `<div class="colonnes">${P.map(([t, L, cls]) => `<div class="colonne"><span class="etiq">${t}</span>
    <div class="puces">${L.map(l => puceMeca(l, cls)).join("") || `<span class="discret">aucun</span>`}</div></div>`).join("")}</div>` : "";
  const bas = [["Gestes", du("geste")]].filter(([, L]) => L.length).map(([t, L]) => `${t} : ${L.map(l => esc(l.nom.toLowerCase())).join(", ")}`);
  el.innerHTML = rangs.join("") + colonnes + (bas.length ? `<div class="bas">${bas.join(" · ")}</div>` : "")
    || `<p class="discret" style="margin:0">Aucun mécanisme n'est encore affecté à ce jeu.</p>`;
}
const PUCE_POIDS = { 3:"mj", 2:"gras", 1:"mg gras" };   // (1.4) les valeurs non majeures en gras aussi
function resumeThemes(){
  const el = $("#res-themes"); if (!el) return;
  if (D.errThemes){ el.innerHTML = `<p class="discret" style="margin:0">Les thèmes n'ont pas pu être lus (${esc(D.errThemes)}).</p>`; return; }
  const puce = l => { const p = TH.affectes[l.code].poids;
    return `<span class="puce ${PUCE_POIDS[p]} info" tabindex="0">${esc(l.libelle)}${remVisible(TH.affectes[l.code].remarque)}<span class="bulle">${l.libelle_en ? `<i>${esc(l.libelle_en)}</i><br>` : ""}${esc(l.definition || "Pas encore de définition.")}</span></span>`; };
  // (1.1) le sujet en premier, puis le cadre (Abstrait, ou la période et le réalisme), puis les autres facettes
  const cadre = TH.affectes[ABSTRAIT] ? affectesDe("cadre") : [...affectesDe("cadre"), ...affectesDe("periode"), ...affectesDe("realisme")];
  const rangs = [[FACETTES.sujet, affectesDe("sujet")], [FACETTES.cadre, cadre], ...["role", "lieu", "ton", "tag", "reference"].map(f => [FACETTES[f], affectesDe(f)])]
    .filter(([, L]) => L.length).map(([t, L]) => rang(t, L.map(puce).join("")));
  el.innerHTML = rangs.join("") || `<p class="discret" style="margin:0">Aucun thème n'est encore affecté à ce jeu.</p>`;
}

/* ---- l'enregistrement ---- */
const ENTIERS = ["pages", "joueurs_min", "joueurs_max", "duree_min", "duree_max", "contenus_nombre"];
function lireFaits(){
  const f = {};
  ENTIERS.forEach(k => { const t = $("#f-" + k).value.trim(); f[k] = t === "" ? null : /^\d+$/.test(t) ? Number(t) : NaN; });
  const p = $("#f-poids_bgg").value.trim().replace(",", "."); f.poids_bgg = p === "" ? null : /^\d+(\.\d+)?$/.test(p) ? Number(p) : NaN;
  f.usage_unique = $("#f-usage_unique").checked;
  f.prix_gamme = document.querySelector('input[name="prix"]:checked')?.value || null;
  f.contenus_nature = $("#f-contenus_nature").value.trim() || null;
  return f;
}
// (1.4) l'étendue calculée n'est pas une saisie : elle part à chaque enregistrement, sans compter comme une modification
const axesModifies = () => D.axes.map(a => a.code).filter(c => c !== CALCULE && JSON.stringify(D.A[c]) !== JSON.stringify(D.A0[c]));
const etendueAEcrire = () => D.A[CALCULE]?.valeur != null;
const modifie = () => D.F0 != null && (JSON.stringify(lireFaits()) !== D.F0 || axesModifies().length > 0 || materielModifie()
  || (D.A[CALCULE] && D.A[CALCULE].commentaire !== D.A0[CALCULE].commentaire));
function changement(){
  if (!D.ecrit) return;
  const m = modifie(), e = $("#enr-etat");
  e.className = ""; e.textContent = m ? "Modifications non enregistrées" : "";
}
function texteDerniere(){
  const x = D.derniere; if (!x) return D.desc ? "Description pré-remplie, pas encore modifiée" : "Pas encore de description : elle sera créée à l'enregistrement";
  const t = new Date(x.modifie_le), qui = !x.modifie_par ? "la base" : x.modifie_par === D.user.id ? "toi" : D.noms[x.modifie_par] || "un évaluateur";
  return `Modifié le ${t.toLocaleDateString("fr-FR")} à ${t.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" })} par ${qui}`;
}
// les contrôles : nombres entiers positifs, poids BGG de 1 à 5, minimum ≤ maximum
function controler(f){
  const err = [], faux = k => { $("#f-" + k).classList.add("faux"); };
  ENTIERS.forEach(k => { if (Number.isNaN(f[k])){ faux(k); err.push("un nombre entier est attendu"); } });
  if (Number.isNaN(f.poids_bgg) || (f.poids_bgg != null && (f.poids_bgg < 1 || f.poids_bgg > 5))){ faux("poids_bgg"); err.push("le poids BGG va de 1 à 5"); }
  [["joueurs_min", "joueurs_max", "joueurs"], ["duree_min", "duree_max", "durée"]].forEach(([a, b, t]) => {
    if (f[a] != null && f[b] != null && !Number.isNaN(f[a]) && !Number.isNaN(f[b]) && f[a] > f[b]){ faux(a); faux(b); err.push(`${t} : le minimum dépasse le maximum`); } });
  return [...new Set(err)];
}
$("#enregistrer").addEventListener("click", async () => {
  const f = lireFaits(), etat = $("#enr-etat"), err = controler(f);
  if (err.length){ etat.className = "err"; etat.textContent = "À corriger : " + err.join(" ; ") + "."; return; }
  const axes = axesModifies(), faitsModifies = JSON.stringify(f) !== D.F0, mat = materielModifie();
  // (1.4) l'étendue suit les joueurs : elle part avec chaque enregistrement (et seule, si elle diffère de la base)
  const etendueChangee = etendueAEcrire() && (D.A[CALCULE].valeur !== D.A0[CALCULE].valeur || D.A[CALCULE].commentaire !== D.A0[CALCULE].commentaire);
  if (!faitsModifies && !axes.length && !mat && !etendueChangee){ etat.className = ""; etat.textContent = "Rien à enregistrer."; return; }
  if (etendueAEcrire()) axes.push(CALCULE);
  $("#enregistrer").disabled = true; etat.className = ""; etat.textContent = "Enregistrement…";
  // l'horodatage (modifie_le, modifie_par) est tenu par la base ; la ligne de description est créée si elle n'existe pas
  const r1 = faitsModifies || !D.desc ? await sb.from("prisme_descriptions").upsert({ jeu:D.code, ...f }, { onConflict:"jeu" }) : {};
  const r2 = !r1.error && axes.length ? await sb.from("prisme_descriptions_axes").upsert(axes.map(c => ({ jeu:D.code, axe:c, valeur:D.A[c].valeur,
    sans_objet:D.A[c].sans_objet, commentaire:D.A[c].commentaire.trim() || null })), { onConflict:"jeu,axe" }) : {};
  // (1.4) le matériel : les coches ajoutées (poids 2, comme dans le sélecteur), les coches retirées
  let r3 = {};
  if (!r1.error && !r2.error && mat){
    const plus = [...D.mat].filter(c => !D.mat0.has(c)), moins = [...D.mat0].filter(c => !D.mat.has(c)), maintenant = new Date().toISOString();
    r3 = plus.length ? await sb.from("prisme_jeux_mecanismes").upsert(plus.map(c => ({ jeu:D.code, mecanisme:c, poids:2, remarque:null, modifie_le:maintenant, modifie_par:D.user.id })), { onConflict:"jeu,mecanisme" }) : {};
    if (!r3.error && moins.length) r3 = await sb.from("prisme_jeux_mecanismes").delete().eq("jeu", D.code).in("mecanisme", moins);
  }
  $("#enregistrer").disabled = false;
  const e = r1.error || r2.error || r3.error;
  if (e){ etat.className = "err"; etat.textContent = (r1.error ? "Rien n'a pu être enregistré : " : r2.error ? "Les faits sont enregistrés, pas les axes : " : "Les faits et les axes sont enregistrés, pas le matériel : ") + e.message; return; }
  // relire la base : la page montre ce qui y est vraiment
  const haut = scrollY, [e2, e3] = await Promise.all([lireDescription(), mat ? lireMecanismes(D.code, D.user, M.role) : null]);
  if (mat){ D.errMeca = e3; lireMateriel(); }
  if (e2 || e3){ etat.className = "err"; etat.textContent = "Enregistré, mais la relecture a échoué : " + (e2 || e3); return; }
  dessiner(); scrollTo(0, haut);
  $("#enr-etat").className = "ok"; $("#enr-etat").textContent = "Enregistré.";
});
$("#annuler").addEventListener("click", () => {
  if (!modifie()) return;
  if (!confirm("Abandonner les modifications non enregistrées ?")) return;
  const haut = scrollY; D.A = JSON.parse(JSON.stringify(D.A0)); D.mat = new Set(D.mat0); dessiner(); scrollTo(0, haut);
});
// (1.6) « + Générer l'all-in » : la fonction de la base crée la sous-fiche à partir du jeu de base, puis on l'ouvre
async function genererAllIn(){
  const b = $("#generer-allin"), etat = $("#enr-etat");
  if (modifie() && !confirm("Des modifications ne sont pas enregistrées : elles seront perdues. Continuer ?")) return;
  if (!confirm("La sous-fiche all-in reprendra la description, les mécaniques et les thèmes du jeu de base ; tu la compléteras ensuite.")) return;
  b.disabled = true; etat.className = ""; etat.textContent = "Création de la sous-fiche all-in…";
  const { data, error } = await sb.rpc("prisme_generer_all_in", { p_base: D.code });   // (1.7) le paramètre de la fonction s'appelle p_base
  if (error){ b.disabled = false; etat.className = "err"; etat.textContent = "L'all-in n'a pas pu être généré : " + error.message; return; }
  // la fonction renvoie le code de la sous-fiche ; à défaut, on la cherche parmi les sous-fiches de la même fiche globale
  let code = typeof data === "string" ? data : data?.code || data?.[0]?.code || null;
  if (!code){
    const { data: j } = await sb.from("prisme_jeux").select("fiche_globale").eq("code", D.code).maybeSingle();
    const { data: fr } = j?.fiche_globale ? await sb.from("prisme_jeux").select("code").eq("fiche_globale", j.fiche_globale).eq("configuration", "all_in") : { data:null };
    code = fr?.[0]?.code || null;
  }
  if (!code){ b.disabled = false; etat.className = "err"; etat.textContent = "L'all-in semble créé, mais introuvable : recharge la page."; return; }
  D.part = true; location.href = "decrire.html?jeu=" + encodeURIComponent(code);
}
// (1.9) recopier depuis l'autre sous-fiche : quatre blocs à cocher (aucun au départ) ; ce qui est coché est remplacé ici
// par prisme_recopier_description(source, cible, faits, mécanismes, thèmes, axes), puis la page est rechargée
const BLOCS_RECOPIE = [["faits", "Faits et prix", "En bref, le prix, le nombre et la nature des contenus."],
  ["mecanismes", "Mécaniques", "Avec le matériel coché, qui est rangé parmi les mécanismes."],
  ["themes", "Thèmes", ""], ["axes", "Axes descriptifs", "Valeurs, « sans objet » et commentaires."]];
function ouvrirRecopier(){
  const d = $("#dlg-recopier"), de = nomCfgMin(D.source.configuration);
  d.innerHTML = `<h2 id="dlg-recopier-titre">Recopier depuis le ${esc(de)}</h2>
    <p class="question">Choisis ce qui doit être repris du ${esc(de)} dans cette sous-fiche.</p>
    ${BLOCS_RECOPIE.map(([k, t, a]) => `<label class="case"><input type="checkbox" data-bloc="${k}"><span>${esc(t)}${a ? `<small>${esc(a)}</small>` : ""}</span></label>`).join("")}
    <p class="avert">Ce que tu coches sera <b>remplacé</b> ici par le contenu de l'autre sous-fiche. L'ancien contenu reste dans le journal de la Forge.</p>
    <p class="m-actions"><button class="btn plein" type="button" id="rec-ok" disabled>Recopier</button><button class="btn" type="button" id="rec-annuler">Annuler</button><span class="m-etat" id="rec-etat" role="status"></span></p>`;
  const coches = () => Object.fromEntries(BLOCS_RECOPIE.map(([k]) => [k, d.querySelector(`[data-bloc="${k}"]`).checked]));
  d.onchange = () => { $("#rec-ok").disabled = !Object.values(coches()).some(Boolean); };   // « Recopier » dès qu'une case est cochée
  $("#rec-annuler").addEventListener("click", () => d.close());
  $("#rec-ok").addEventListener("click", async () => {
    const c = coches(), etat = $("#rec-etat");
    if (modifie() && !confirm("Des modifications ne sont pas enregistrées ici : elles seront perdues. Continuer ?")) return;
    $("#rec-ok").disabled = true; etat.className = "m-etat discret"; etat.textContent = "Recopie…";
    const { error } = await sb.rpc("prisme_recopier_description", { p_source: D.source.code, p_cible: D.code,
      p_faits: c.faits, p_mecanismes: c.mecanismes, p_themes: c.themes, p_axes: c.axes });
    if (error){ $("#rec-ok").disabled = false; etat.className = "m-etat err"; etat.textContent = "Rien n'a été recopié : " + error.message; return; }
    D.part = true; location.reload();
  });
  d.showModal();
}
const nomCfgMin = c => (CONFIGS[c] || "Jeu de base").toLowerCase();
// prévenir si l'on quitte la page avec des changements non enregistrés
addEventListener("beforeunload", e => { if (D.ecrit && !D.part && modifie()){ e.preventDefault(); e.returnValue = ""; } });
</script>
