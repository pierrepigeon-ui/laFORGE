<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flamme Bleue — statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="flamme_moteur.js?v=1.7"></script>
<script src="flamme_glyphes.js?v=2.4"></script>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#DDE1E7;--paper:#F4F6F8;--panel:#FFFFFF;--hover:#EEF1F5;--ok:#1E7A46;--warn:#9A5B00;--err:#B42318;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input{font:inherit;color:inherit} :focus-visible{outline:2px solid #3B6FE0;outline-offset:2px} .hidden{display:none!important}
header{position:sticky;top:0;z-index:40;display:flex;align-items:baseline;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.wordmark a{color:inherit;text-decoration:none} .wordmark a:hover{opacity:.7}
.wordmark{font:600 24px/1 var(--serif);letter-spacing:.02em;margin:0} .signature{font:italic 14px/1.4 var(--serif);color:var(--muted);margin:0}
header nav a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:5px} header nav a:hover{background:var(--hover);color:var(--ink)}
.who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.msg{font-size:14px;min-height:1.4em;margin:6px 0 0} .msg.err{color:var(--err)}
.bloque{max-width:560px;margin:60px auto;padding:0 20px;font:italic 17px/1.5 var(--serif);color:var(--muted)}
.outils{max-width:1000px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}

/* détail */
main{max-width:1400px;margin:16px auto 40px;padding:0 20px}
.carte-entete{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.carte-entete h1{font:600 26px/1.2 var(--serif);margin:0 0 4px}
.carte-entete .meta{color:var(--muted);font-size:14px}
.familles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.fam{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fam .t{font-size:12px;color:var(--muted)} .fam .c{font:600 15px var(--serif)} .fam .sc{font-size:13px;color:var(--muted)}
h2{font:600 19px var(--serif);margin:22px 0 10px}
.acces{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
/* légende : une case par bande, sur la même grille que les 5 colonnes de la liste */
.legende{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 16px;font-size:12.5px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
/* chaque case en parallélogramme, côtés obliques à 45° (décalage = hauteur de la case) */
.legende .lg{height:26px;padding:0 30px;display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;
  clip-path:polygon(26px 0,100% 0,calc(100% - 26px) 100%,0 100%)} .legende b{color:#1B2430;font-weight:600}
.legende .lg span{color:#3A4554;font-variant-numeric:tabular-nums}
.flux{column-count:5;column-gap:16px}
.flux .chip{break-inside:avoid;padding-left:6px;padding-right:6px;border-radius:4px;margin-bottom:2px;color:#1B2430}
.chip{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--hover)}
.chip .gl{flex:none;line-height:0} .chip .gl svg.g{height:16px;width:auto} .chip .cd{font-weight:600;white-space:nowrap} .chip .nm{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .chip .sc{font-variant-numeric:tabular-nums}
.flux .chip .nm{color:#3A4554} .flux .chip .sc{color:#1B2430}
.chip.moi{box-shadow:inset 0 0 0 2px #1B2430;font-weight:600} .chip.moi .nm{color:#1B2430}
/* bandes d'accessibilité : fonds pastel (naturel cyan, accessible vert, situationnel jaune, difficile orange, inaccessible rouge) */
.b-naturel{background:#EAF7FA} .b-accessible{background:#EDF7EB} .b-situationnel{background:#FCF8E6} .b-difficile{background:#FDF0E4} .b-inaccessible{background:#FBEBEA}
.legende .b-naturel{background:#D3F0F6} .legende .b-accessible{background:#DCF1D8} .legende .b-situationnel{background:#FBF1C8} .legende .b-difficile{background:#FCDDC2} .legende .b-inaccessible{background:#F7CFCC}
.b-naturel,.b-accessible,.b-situationnel,.b-difficile,.b-inaccessible{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.note.large{max-width:none}
/* cohérence du test */
.coh-tete{display:flex;gap:16px 28px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.coh-rho{font:600 34px/1 var(--serif);font-variant-numeric:tabular-nums} .coh-rho small{display:block;font:400 12px var(--sans);color:var(--muted);margin-top:4px}
.coh-bande{font:600 14px var(--sans);padding:4px 12px;border-radius:999px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.coh-tres{background:#D6EFDC;color:#14532D} .coh-coherent{background:#E6F4D8;color:#365314} .coh-fragile{background:#FCE3C6;color:#7C3A0A} .coh-hasard{background:#F7D3D0;color:#7F1D1D}
.coh-texte{flex:1;min-width:260px;font-size:13.5px;color:var(--muted);line-height:1.5}
.coh-table-cadre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto}
table.coh{border-collapse:collapse;width:100%;font-size:13px}
table.coh th{font:600 12px var(--sans);color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.coh th.g{text-align:left} table.coh th button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline dotted}
table.coh th button[aria-pressed="true"]{color:var(--ink);text-decoration:none} table.coh th button[aria-pressed="true"]::after{content:" ▼"}
table.coh td{padding:3px 8px;border-bottom:1px solid var(--hover);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.coh td.g{text-align:left} table.coh td.g .n{margin-left:6px}
table.coh td.fort{font-weight:600} table.coh tr.loin{background:#FFF4E5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.coh .sep{border-left:1px solid var(--line)}
/* robustesse du profil */
.rob-tete{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.rob-score{font:600 30px/1 var(--serif)} .rob-score small{font:500 13px var(--sans);color:var(--muted);margin-left:4px}
.rob-texte{flex:1;min-width:260px;font-size:13.5px;color:var(--muted);line-height:1.5}
.rob-cadre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto}
table.rob{border-collapse:collapse;width:100%;font-size:13px}
table.rob th{font:600 12px var(--sans);color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.rob th.v{text-align:left} table.rob th.mil,table.rob td.mil{border-left:2px solid var(--line)}
table.rob td{padding:5px 6px;border-bottom:1px solid var(--hover);vertical-align:middle}
table.rob td.v{white-space:nowrap;font-weight:600} table.rob td.v .pips{margin-right:6px}
table.rob .cel{display:flex;gap:5px;align-items:center;border-radius:6px;padding:3px 6px;font-size:12.5px;line-height:1.25}
table.rob .cel svg.g{height:14px;width:auto;flex:none}
table.rob .tient{color:var(--muted)} table.rob .bascule{background:#FFF1D6;color:var(--ink);font-weight:500;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* classements : col. 1 valeurs, motivations, projets ; col. 2 les mêmes polarisés ; col. 3 styles ; col. 4 tempéraments */
.sections{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.sections .colonne{display:flex;flex-direction:column;gap:12px;min-width:0}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;break-inside:avoid}
.sect h3{font:600 15px/1.3 var(--serif);margin:0 0 6px} .sect h3 sup{line-height:0}   /* l'astérisque ne décale plus les lignes d'une colonne à l'autre */ .sect .ex{font-size:12px;color:var(--muted);margin:0 0 8px}
.sect table{border-collapse:collapse;width:100%;font-size:13px}
.sect td{padding:2px 4px;border-bottom:1px solid var(--hover)} .sect td.r{color:var(--muted);width:24px} .sect td.s{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sect td.n{color:var(--muted)} .sect td.c{white-space:nowrap}
.pol{font-weight:inherit} .sect h3 sup,.note sup{font-size:.7em;margin-left:1px} .note{font-size:13px;color:var(--muted);max-width:900px;margin:14px 0 0;line-height:1.5}
.pips{display:inline-flex;gap:3px;align-items:center;vertical-align:1px} svg.g{vertical-align:middle;display:inline-block;overflow:visible}
.pip{width:11px;height:11px;border-radius:50%;border:1px solid #8892A0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pip.sec{width:7px;height:7px} .pip.abs{background:transparent!important;border:1.5px dashed var(--c)} .pip.sep{width:auto;height:auto;border:0;font-size:10px;color:#5B6573}
/* aperçu de fiche au survol */
[data-code]{cursor:help} .chip[data-code]:hover,.sect tr[data-code]:hover,.fam .c[data-code]:hover{background:var(--hover)}
.apercu{position:fixed;z-index:50;width:min(420px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 30px rgba(15,25,40,.18);padding:14px 16px 12px;font-size:13.5px;line-height:1.5}
.apercu.epingle{border-color:#3B6FE0;box-shadow:0 10px 30px rgba(15,25,40,.25),0 0 0 1px #3B6FE0}
.apercu .ap-tete{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:4px}
.apercu .ap-tete .ap-code{font-weight:600;color:var(--ink)} .apercu .ap-tete .ap-x{margin-left:auto;border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);padding:2px 4px}
.apercu h4{font:600 19px/1.25 var(--serif);margin:2px 0} .apercu .ap-devise{font:italic 15px/1.4 var(--serif);color:var(--muted);margin:0 0 8px}
.apercu .ap-absence{background:#FDECEA;color:#8A1C12;border-radius:6px;padding:5px 8px;font-size:12.5px;margin:4px 0 8px}
.apercu .ap-titre{font-weight:600;margin:6px 0 2px} .apercu p{margin:0 0 6px}
.apercu .ap-bloc{border-top:1px solid var(--hover);padding-top:6px;margin-top:6px} .apercu .ap-bloc b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.apercu .ap-bloc.fort{background:#FFF8E6;border-radius:6px;padding:6px 8px;border-top:0}
.apercu .ap-liens{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .apercu .ap-liens a{font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 9px;text-decoration:none}
.apercu .ap-liens a:hover{background:var(--hover)} .apercu .ap-aide{font-size:11.5px;color:var(--muted);margin-top:8px}
@media print{ .apercu{display:none!important} }
footer{border-top:1px solid var(--line);background:var(--panel);padding:4px 20px;text-align:right;font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:24px;width:min(380px,92vw)} dialog::backdrop{background:rgba(10,15,25,.45)}
.field{display:block;margin-bottom:12px} .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
@media (max-width:1100px){ .flux{column-count:3} .legende{grid-template-columns:repeat(3,minmax(0,1fr))} .familles{grid-template-columns:1fr 1fr} .sections{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:700px){ .flux{column-count:1} .legende{grid-template-columns:1fr} .sections{grid-template-columns:1fr} }
@page{size:A4 landscape;margin:10mm}
@media print{ body{background:#fff} header,.outils,footer,dialog{display:none!important} main{max-width:none;margin:0;padding:0}
  .flux,.sect,.carte-entete{border-color:#ccc} h2{margin:8px 0 6px;font-size:16px}
  /* page 1 : en-tête et 90 profils ; page 2 : les classements */
  .carte-entete{padding:10px 14px;margin-bottom:8px} .carte-entete h1{font-size:20px} .familles{margin-top:8px;gap:8px} .fam{padding:6px 10px}
  .acces{padding:6px 8px} .flux{column-count:5} .flux .chip{font-size:10.5px;padding-top:1.5px;padding-bottom:1.5px;margin-bottom:1px} .legende{grid-template-columns:repeat(5,minmax(0,1fr))}
  .chip .gl svg.g{height:13px} .legende{font-size:11px;margin:0 0 6px}
  h2.classements,h2.coherence,h2.robustesse{break-before:page;margin-top:0}
  table.rob{font-size:11px} table.rob td{padding:3px 4px}
  .coh-tete{padding:8px 12px} .coh-rho{font-size:26px} table.coh{font-size:11px} table.coh td,table.coh th{padding:1.5px 6px}
  .sections{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .sections .colonne{gap:8px} .sect{padding:6px 8px;break-inside:avoid}
  .sect h3{font-size:13px} .sect .ex{font-size:10px;margin:0 0 4px} .sect table{font-size:10px;line-height:1.15} .sect td{padding:0.5px 3px}
  .sect td.n{max-width:0;width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sect svg.g{height:11px;width:auto} .sect .pip{width:9px;height:9px} .sect .pip.sec{width:6px;height:6px}
  .note{font-size:10.5px;margin-top:6px} }
</style>
</head>
<body>
<header>
  <h1 class="wordmark"><a href="index.html" title="Accueil de Flamme Bleue">Flamme Bleue</a></h1><p class="signature">Cartographiez votre énergie</p>
  <nav><a href="autotest.html">Autotest</a></nav>
  <div class="who"><span id="who"></span>
    <button class="btn ghost" id="btn-login" type="button">Se connecter</button>
    <button class="btn ghost hidden" id="btn-logout" type="button">Se déconnecter</button></div>
</header>
<p class="bloque" id="bloque">Chargement…</p>
<div class="outils hidden" id="outils">
  <button class="btn" type="button" onclick="window.print()">Imprimer ou enregistrer en PDF</button>
  <a class="btn ghost" id="lien-fiche" href="#">Voir la fiche</a>
</div>
<main class="hidden" id="page"></main>
<div class="apercu hidden" id="apercu" role="dialog" aria-label="Aperçu de la fiche"></div>
<footer id="version"></footer>
<dialog id="dlg-login"><form id="form-login"><h2 style="font:600 22px var(--serif);margin:0 0 14px">Se connecter</h2>
  <label class="field"><span>Adresse e-mail</span><input type="email" id="email" autocomplete="username" required></label>
  <label class="field"><span>Mot de passe</span><input type="password" id="password" autocomplete="current-password" required></label>
  <div style="display:flex;gap:10px"><button class="btn" type="submit">Se connecter</button><button class="btn ghost" type="button" id="login-fermer">Fermer</button></div>
  <p class="msg" id="login-msg" role="status"></p></form></dialog>
<script>
const VERSION = { numero:"1.25", date:"2026-10-17 19:45" };
const SUPABASE_URL = "https://gugdfpbkscudzkgysteb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7aY8jgB45yEGd_M-R7VUDw_IQTNfg6P";
const ACCES = ["proprietaire"];
const M = window.FLAMME_MOTEUR;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => (x * 100).toFixed(1).replace(".", ",") + " %";
const dateFr = d => new Date(d).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
let user = null, role = null, E = {}, C = {}, V = {};
$("#version").textContent = `Statistiques ${VERSION.numero}, version du ${VERSION.date.replace(/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/,"$3/$2/$1 à $4h$5")} — moteur ${M.VERSION.numero}`;

function pips(code){
  // glyphe (projets, profils, styles, tempéraments) si le code en a un ; sinon les pastilles rondes
  const g = window.FLAMME_GLYPHES?.glyphe(code, Object.fromEntries(Object.entries(C).map(([k, v]) => [k, v.couleur])), { fondMini: "#8892A0" }); if (g) return g;
  let out = "", absent = false;
  for (const ch of code){
    if (ch === "/"){ absent = true; out += '<span class="pip sep">/</span>'; continue; }
    const up = ch.toUpperCase(), c = C[up]; if (!c) continue;
    const cls = ch === up ? "pip" : (absent ? "pip abs" : "pip sec");
    out += `<span class="${cls}" style="background:${c.couleur};--c:${c.couleur === '#FFFFFF' ? '#8892A0' : c.couleur}"></span>`;
  }
  return `<span class="pips" aria-hidden="true">${out}</span>`;
}
const NOMS_COULEUR = { W:"blanc", U:"bleu", B:"noir", R:"rouge", G:"vert" };
function libelle(code){
  if (E[code]) return E[code].nom;
  if (code.startsWith("/")){   // motivation ou projet en absence : « NE PAS » + son verbe, comme les anti-valeurs
    const e = E[code.slice(1).toUpperCase()];
    return e ? "NE PAS " + e.nom : "absence de " + [...code.slice(1).toUpperCase()].map(c => NOMS_COULEUR[c]).join(", ");
  }
  return "";
}

const POL = '<i class="pol">polarisées</i><sup>*</sup>', POLS = '<i class="pol">polarisés</i><sup>*</sup>';
const SECTIONS = [
  ["valeurs", "Valeurs", "1 valeur — score brut"],
  ["valeursPolarisees", "Valeurs " + POL, "1 valeur — présence ou absence la plus marquée"],
  ["motivations", "Motivations", "2 valeurs — données corrigées"],
  ["motivationsPolarisees", "Motivations " + POL, "2 valeurs — présence ou absence la plus marquée, données corrigées"],
  ["projets", "Projets", "3 valeurs — données corrigées"],
  ["projetsRedresses", "Projets " + POLS, "3 valeurs — présence ou absence la plus marquée, données corrigées"],
  ["directions", "Styles", "1 valeur principale, 1 valeur secondaire — données corrigées"],
  ["temperaments", "Tempéraments", "1 valeur présente, 1 valeur absente"]
];
const nb1 = x => (Math.round(x * 10) / 10).toString().replace(".", ",");
const signeN = (x, suffixe = "") => { const v = Math.round(x * 10) / 10; return (v > 0 ? "+" : v < 0 ? "−" : "") + (suffixe ? Math.abs(v).toFixed(1).replace(".", ",") : nb1(Math.abs(v))) + suffixe; };   // points : toujours une décimale
const CLASSE_BANDE = { "très cohérent": "coh-tres", "cohérent": "coh-coherent", "fragile": "coh-fragile", "proche du hasard": "coh-hasard" };
let COH = null, triCoh = "rang";
function lignesCoherence(){
  const cle = triCoh === "rang" ? (l => Math.abs(l.ecartRang) * 1000 + Math.abs(l.ecartProx)) : (l => Math.abs(l.ecartProx) * 1000 + Math.abs(l.ecartRang));
  return COH.lignes.slice().sort((a, b) => cle(b) - cle(a)).map((l, i) => `<tr data-code="${esc(l.code)}" tabindex="0" class="${Math.abs(l.ecartRang) >= 4 ? "loin" : ""}">
    <td>${i + 1}</td><td class="g">${pips(l.code)}<span class="n">${esc(libelle(l.code))}</span></td>
    <td class="sep">${l.rangDeclare}</td><td>${nb1(l.rangAttendu)}</td><td class="${triCoh === "rang" ? "fort" : ""}">${signeN(l.ecartRang)}</td>
    <td class="sep">${Math.round(l.proxDeclaree)} %</td><td>${Math.round(l.proxAttendue)} %</td><td class="${triCoh === "prox" ? "fort" : ""}">${signeN(l.ecartProx, " pts")}</td></tr>`).join("");
}
function blocCoherence(src){
  if (!Array.isArray(src.classement) || src.classement.length !== 20)
    return `<p class="note large">La cohérence demande le classement des 20 tempéraments : ouvrez les statistiques depuis un résultat enregistré${src.type ? " (un profil type n'a pas de classement)" : ""}.</p>`;
  COH = M.coherence(src.classement, Array.isArray(src.ecarts) && src.ecarts.length === 19 ? src.ecarts.map(Number) : undefined);
  return `<div class="coh-tete"><div class="coh-rho">${COH.rho.toFixed(2).replace(".", ",")}<small>indice ρ</small></div>
      <span class="coh-bande ${CLASSE_BANDE[COH.bande]}">${COH.bande[0].toUpperCase() + COH.bande.slice(1)}</span>
      <p class="coh-texte">L'indice compare le classement déclaré des tempéraments à celui que ses propres scores prévoient : 1 si les deux sont identiques.
        Repères : au moins 0,90 très cohérent, 0,80 cohérent, 0,70 fragile, en dessous proche du hasard. Un classement tiré au hasard obtient déjà 0,44 en moyenne (0,69 dans 95 % des cas), parce que les scores viennent du même classement.</p></div>
    <div class="coh-table-cadre"><table class="coh"><thead><tr>
      <th>#</th><th class="g">Tempérament</th><th class="sep">Rang déclaré</th><th>Rang attendu</th><th><button type="button" data-tri="rang" aria-pressed="${triCoh === "rang"}">Écart de rang</button></th>
      <th class="sep">Proximité déclarée</th><th>Proximité attendue</th><th><button type="button" data-tri="prox" aria-pressed="${triCoh === "prox"}">Écart de proximité</button></th>
    </tr></thead><tbody id="coh-corps">${lignesCoherence()}</tbody></table></div>
    <p class="note large">Du plus éloigné au moins éloigné ; cliquez sur un en-tête d'écart pour changer de tri. Écart positif : la carte a été placée plus près de soi que ses scores ne le prévoient ; négatif : plus loin.
      La proximité déclarée tient compte des intercalaires (100 % pour la carte la plus proche, 0 % pour la plus éloignée) ; la proximité attendue ramène les scores des tempéraments sur la même échelle. Lignes surlignées : 4 rangs d'écart ou plus.</p>`;
}
const COLONNES = [["valeurs", "motivations", "projets"], ["valeursPolarisees", "motivationsPolarisees", "projetsRedresses"], ["directions"], ["temperaments"]];
const NOTE_POLARISE = `<p class="note"><sup>*</sup> <i>Polarisé</i> : chaque score est lu par son écart à 50 %, dans un sens comme dans l'autre.
  Une valeur très présente (90 %) et une valeur très absente (10 %) pèsent autant ; la seconde s'affiche comme une absence : glyphe en croix pour une valeur seule, mini-rosace barrée sur fond rouge pâle pour une motivation ou un projet.
  Le classement montre donc ce qui marque le plus le profil, par sa présence ou par son absence.</p>`;
const BANDES = [["naturel","≥ +30 pts"],["accessible","+15 à +30 pts"],["situationnel","−15 à +15 pts"],["difficile","−30 à −15 pts"],["inaccessible","≤ −30 pts"]];
const signe = x => { const v = Math.round(x * 1000) / 10; return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(".", ","); };   // accessibilité, en points
const NOTE_ACCES = `<p class="note large">Pour chaque profil, les cinq valeurs se rangent en trois étages : principales, secondaires, autres.
  On mesure l'écart entre les valeurs de deux étages différents (huit paires, quelle que soit la famille) et on en fait la moyenne.
  L'unité est le point de pourcentage : vos scores sont des pourcentages, et un écart de 30 points sépare par exemple 80 % de 50 %.
  Positif : les scores soutiennent la structure du profil, et plus la marge est grande, moins le profil est menacé. Négatif : les scores la contredisent.
  Un profil et son opposé ont des scores exactement opposés. La liste se lit en colonnes, du plus accessible au moins accessible ; votre profil est encadré.</p>`;

async function lireScores(){
  const q = new URLSearchParams(location.search);
  if (q.get("type")){
    const code = q.get("type");
    if (!M.analyser(code).famille) throw new Error(`« ${code} » n'est pas un code de profil.`);
    return { scores: M.scoresTypes(code), date: null, qui: "", type: code };
  }
  if (q.get("catalogue")){                                                    // fiche du catalogue de profils
    const { data, error } = await sb.from("flamme_catalogue").select("*").eq("id", q.get("catalogue")).maybeSingle();
    if (error || !data) throw new Error("Cette fiche du catalogue est introuvable, ou tu n'as pas le droit de la consulter.");
    return { scores: data.scores, date: data.cree_le, qui: "Catalogue : " + data.nom, classement: data.classement, ecarts: data.ecarts, catalogue: data.id };
  }
  if (q.get("resultat")){
    const { data, error } = await sb.from("flamme_resultats").select("*").eq("id", q.get("resultat")).maybeSingle();
    if (error || !data) throw new Error("Ce résultat est introuvable.");
    const { data: pers } = await sb.rpc("flamme_personnes"); const p = (pers || []).find(x => x.user_id === data.user_id);
    return { scores: data.scores, date: data.passe_le, qui: p ? (p.nom || p.email) : "", classement: data.classement, ecarts: data.ecarts };
  }
  const s = {}; for (const c of M.ORDRE){ const v = parseFloat(String(q.get(c) ?? "").replace(",", ".")); if (!isFinite(v)) throw new Error("Il manque des scores : ouvre les statistiques depuis la console ou depuis une fiche."); s[c] = v; }
  return { scores: s, date: new Date().toISOString(), qui: "" };
}

/* ---------- robustesse du profil (méthode de Pierre, moteur 1.7) ---------- */
const NOMS_VAL = { W: "intégrer", U: "penser", B: "réussir", R: "vibrer", G: "affirmer" };
function blocRobustesse(src, st){
  if (!M.robustesse) return `<p class="note large">La robustesse demande le moteur 1.7 : vide le cache du navigateur (Ctrl + F5).</p>`;
  const R = M.robustesse(src.scores), moi = new Set(st.profil.codes);
  const cel = p => { const b = !moi.has(p.code);
    return `<div class="cel ${b ? "bascule" : "tient"}" data-code="${esc(p.code)}" tabindex="0" title="${M.ORDRE.map(c => c + " " + Math.round(p.scores[c])).join(" · ")}">${pips(p.code)}<span>${esc(b ? libelle(p.code) : "inchangé")}</span></div>`; };
  const tous = R.lignes.flatMap(l => l.paliers), tient = tous.filter(p => moi.has(p.code)).length;
  const dest = {}; tous.filter(p => !moi.has(p.code)).forEach(p => dest[p.code] = (dest[p.code] || 0) + 1);
  const top = Object.entries(dest).sort((a, b) => b[1] - a[1]);
  const fragiles = R.lignes.filter(l => !moi.has(l.paliers[0].code));
  const ordreCol = [-30, -20, -10, 10, 20, 30];
  return `<div class="rob-tete"><span class="rob-score">${tient}<small>/ ${tous.length} situations sans changement de profil</small></span>
    <div class="rob-texte">Que se passe-t-il quand l'environnement pousse vers des valeurs qui ne sont pas les vôtres ? Chaque valeur est poussée vers le haut ou vers le bas,
      faiblement (10 points), fortement (20) ou de façon colossale (30), et l'on regarde le profil obtenu.
      ${top.length ? `Quand le profil bascule, c'est le plus souvent vers ${top.slice(0, 3).map(([c, n]) => `<b>${esc(libelle(c))}</b> (${n})`).join(", ")}.` : "Le profil ne bascule jamais."}
      ${fragiles.length ? ` Bascule dès une poussée faible : ${fragiles.map(l => `${esc(NOMS_VAL[l.valeur])} ${l.sens > 0 ? "en hausse" : "en baisse"}`).join(", ")}.` : ""}</div></div>
    <div class="rob-cadre"><table class="rob"><thead><tr><th class="v">Valeur poussée</th>${ordreCol.map(n => `<th${n === 10 ? ' class="mil"' : ""}>${n > 0 ? "+" : "−"}${Math.abs(n)}</th>`).join("")}</tr></thead><tbody>
      ${M.ORDRE.map(c => `<tr><td class="v">${pips(c)}${esc(NOMS_VAL[c])}</td>${ordreCol.map(n => { const l = R.lignes.find(x => x.valeur === c && x.sens === Math.sign(n)); const p = l.paliers.find(x => x.points === n);
        return `<td${n === 10 ? ' class="mil"' : ""}>${cel(p)}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div>
    <p class="note">Règles (méthode de Pierre) : la valeur poussée prend ses points aux valeurs opposées — d'abord la plus faible si elles doivent baisser, la plus haute si elles doivent monter —,
      puis aux valeurs alliées (la plus basse pour baisser, la plus haute pour monter). Sous 20 % ou au-dessus de 80 %, une valeur ne bouge que de moitié ; elle ne franchit jamais 10 % ni 90 %.
      Ce qui ne peut être réparti n'est pas pris. La somme reste de 250 %. Le profil obtenu est calculé directement sur ces scores ; survolez une case pour lire les scores.</p>`;
}

function rendre(src){
  const s01 = Object.fromEntries(M.ORDRE.map(c => [c, src.scores[c] / 100]));
  const codesProfils = Object.values(E).filter(e => e.couche === "profil").sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0)).map(e => e.code);
  const st = M.statistiques(s01, codesProfils, { classement: src.classement });
  const moi = new Set(st.profil.codes);
  const fam = (titre, liste) => `<div class="fam"><div class="t">${titre}</div>${liste.map(x => `<div class="c" data-code="${esc(x.code)}" tabindex="0">${pips(x.code)} ${esc(libelle(x.code))}</div>`).join("")}
    <div class="sc">${liste.length ? signe(liste[0].score) + " pts — " + liste[0].bande : ""}${liste.length > 1 ? " (égalité)" : ""}</div></div>`;
  $("#page").innerHTML = `
    <section class="carte-entete">
      <h1>Statistiques du profil ${st.profil.codes.map(c => `${pips(c)} ${esc(libelle(c))}`).join(" / ")}</h1>
      <div class="meta">${src.type ? "Profil type (scores types de la famille)" : (src.qui ? esc(src.qui) + " — " : "") + dateFr(src.date)} — scores : ${M.ORDRE.map(c => `${c} ${pct(s01[c])}`).join(", ")}${st.profil.frontiere ? " — profil frontière" : ""}</div>
      <div class="familles">
        ${fam("Meilleur radical (1.23)", st.parFamille.radical)}
        ${fam("Meilleur spécialiste (12.3)", st.parFamille.specialiste)}
        ${fam("Meilleur généraliste (12/5)", st.parFamille.generaliste)}
        ${fam("Profil le moins accessible", st.moinsAccessibles)}
      </div>
    </section>
    <h2>Accessibilité des 90 profils</h2>
    ${NOTE_ACCES}
    <div class="acces">
    <div class="legende">${BANDES.map(([b, lim]) => `<span class="lg b-${b}"><b>${b[0].toUpperCase() + b.slice(1)}</b><span>${lim} · ${st.sections.profils.filter(p => p.bande === b).length}</span></span>`).join("")}</div>
    <div class="flux">${st.sections.profils.map(p =>   // une seule liste continue, en colonnes ; la couleur de fond dit la bande
      `<div class="chip b-${p.bande}${moi.has(p.code) ? " moi" : ""}" data-code="${esc(p.code)}" tabindex="0"><span class="gl">${pips(p.code)}</span><span class="nm">${esc(libelle(p.code))}</span><span class="sc">${signe(p.score)}</span></div>`).join("")}</div>
    </div>
    <h2 class="classements">Classements</h2>
    <div class="sections">${COLONNES.map(col => `<div class="colonne">${col.map(k => { const [, titre, ex] = SECTIONS.find(x => x[0] === k); return `<section class="sect"><h3>${titre}</h3><table>
      ${st.sections[k].map(x => `<tr data-code="${esc(x.code)}" tabindex="0"><td class="r">${x.rang}</td><td class="c">${pips(x.code)}</td><td class="n">${esc(libelle(x.code))}</td><td class="s">${pct(x.score)}</td></tr>`).join("")}
      </table></section>`; }).join("")}</div>`).join("")}</div>
    ${NOTE_POLARISE}
    <h2 class="coherence">Cohérence du test</h2>
    ${blocCoherence(src)}
    <h2 class="robustesse">Robustesse du profil</h2>
    ${blocRobustesse(src, st)}`;
  document.querySelectorAll("table.coh th button").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation(); triCoh = b.dataset.tri;
    document.querySelectorAll("table.coh th button").forEach(x => x.setAttribute("aria-pressed", x.dataset.tri === triCoh));
    $("#coh-corps").innerHTML = lignesCoherence();
  }));
  $("#lien-fiche").href = "fiche.html" + location.search;
  document.title = `Flamme Bleue — statistiques ${st.profil.codes.join(" / ")}`;
}

/* ---------- aperçu de fiche au survol ----------
   Survol (ou focus clavier) : la fiche de l'élément s'affiche ; on peut entrer dans l'aperçu pour le lire.
   Clic : l'aperçu reste épinglé (clic ailleurs, × ou Échap pour le fermer).
   Absences composées (/wu, /wbg) : fiche de la motivation ou du projet, côté « peu présent ». */
const LIB_PLUS_MOINS = { motivation: ["Impacts si dominante", "Impacts si peu présente"], projet: ["Rôles associés", "Rôles associés (suite)"] };
const ap = $("#apercu"); let apCode = null, apEpingle = false, tMontre = null, tCache = null;
const nl = t => esc(t).replace(/\n/g, "<br>");
function couche(e){
  const v = V.couche?.[e.couche]; let t = v ? v.singulier : e.couche;
  if (e.couche === "profil" && e.famille) t += " " + (V.famille?.[e.famille]?.singulier || e.famille);
  return t;
}
function contenuApercu(code){
  let e = E[code], absence = false;
  if (!e && code.startsWith("/") && code.length > 2){ e = E[code.slice(1).toUpperCase()]; absence = !!e; }
  if (!e) return `<div class="ap-tete">${pips(code)} <span class="ap-code">${esc(code)}</span><button class="ap-x" type="button" aria-label="Fermer">×</button></div><h4>${esc(libelle(code))}</h4><p class="ap-aide">Pas de fiche pour ce code.</p>`;
  const lb = LIB_PLUS_MOINS[e.couche];
  const bloc = (titre, txt, fort) => txt ? `<div class="ap-bloc${fort ? " fort" : ""}"><b>${titre}</b>${nl(txt)}</div>` : "";
  let h = `<div class="ap-tete">${pips(code)} <span class="ap-code">${esc(code)}</span> · ${esc(couche(e))}<button class="ap-x" type="button" aria-label="Fermer">×</button></div>
    <h4>${esc(e.nom || "")}</h4>${e.devise ? `<p class="ap-devise">« ${esc(e.devise)} »</p>` : ""}`;
  if (absence) h += `<div class="ap-absence">Lue en absence : ${esc(libelle(code))}. Fiche de ${esc(e.code)}, côté « peu présent ».</div>`;
  if (e.titre) h += `<p class="ap-titre">${esc(e.titre)}</p>`;
  ["texte1","texte2","texte3"].forEach(k => { if (e[k]) h += `<p>${nl(e[k])}</p>`; });
  if (lb){ h += bloc(lb[0], e.texte_plus, false) + bloc(lb[1], e.texte_moins, absence); }
  if (e.couche === "profil"){
    if (e.devise_heraldique) h += bloc("Devise héraldique", e.devise_heraldique);
    if (e.animal_totem) h += bloc("Animal-totem : " + e.animal_totem, e.animal_raison || " ");
    const t = encodeURIComponent(e.code);
    h += `<div class="ap-liens"><a href="fiche.html?type=${t}" target="_blank" rel="noopener">Fiche du profil type ↗</a><a href="ecusson.html?type=${t}" target="_blank" rel="noopener">Écusson ↗</a><a href="detail.html?type=${t}" target="_blank" rel="noopener">Détail du profil type ↗</a></div>`;
  }
  h += `<p class="ap-aide">${apEpingle ? "Épinglé — Échap ou × pour fermer." : "Clic pour épingler."}</p>`;
  return h;
}
function placer(cible){
  const r = cible.getBoundingClientRect(), w = ap.offsetWidth, hh = ap.offsetHeight, m = 10;
  let x, y = r.top - 8;
  if (r.right + m + w <= innerWidth - m) x = r.right + m;            // à droite
  else if (r.left - m - w >= m) x = r.left - m - w;                  // à gauche
  else { x = Math.max(m, Math.min(innerWidth - w - m, r.left)); y = r.bottom + 6; if (y + hh > innerHeight - m) y = r.top - hh - 6; }   // dessous ou dessus
  y = Math.max(m, Math.min(y, innerHeight - hh - m));
  ap.style.left = x + "px"; ap.style.top = y + "px";
}
function montrer(cible, epingler){
  clearTimeout(tCache); clearTimeout(tMontre); apCode = cible.dataset.code; apEpingle = !!epingler;
  ap.innerHTML = contenuApercu(apCode); ap.classList.toggle("epingle", apEpingle); ap.classList.remove("hidden"); ap.scrollTop = 0; placer(cible);
}
function cacher(){ clearTimeout(tMontre); ap.classList.add("hidden"); apCode = null; apEpingle = false; }
document.addEventListener("mouseover", ev => {
  const c = ev.target.closest("#page [data-code]");
  if (ev.target.closest("#apercu")){ clearTimeout(tCache); return; }
  if (apEpingle) return;
  clearTimeout(tMontre);
  if (c){ if (c.dataset.code !== apCode) tMontre = setTimeout(() => montrer(c), apCode ? 60 : 220); else clearTimeout(tCache); }
  else if (apCode){ clearTimeout(tCache); tCache = setTimeout(cacher, 300); }
});
document.addEventListener("click", ev => {
  if (ev.target.closest(".ap-x")) return cacher();
  if (ev.target.closest("#apercu")) return;
  const c = ev.target.closest("#page [data-code]");
  if (c){ if (apEpingle && apCode === c.dataset.code) cacher(); else montrer(c, true); }
  else if (apCode) cacher();
});
document.addEventListener("focusin", ev => { const c = ev.target.closest("#page [data-code]"); if (c && !apEpingle) montrer(c); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && apCode) cacher();
  const c = ev.target.closest?.("#page [data-code]"); if (c && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); montrer(c, true); }
});
addEventListener("scroll", () => { if (apCode && !apEpingle) cacher(); }, { passive: true });

$("#btn-login").addEventListener("click", () => { location.href = "../?retour=" + encodeURIComponent(location.href); });   // connexion centralisée sur la Forge
$("#login-fermer").addEventListener("click", () => $("#dlg-login").close());
$("#btn-logout").addEventListener("click", () => sb.auth.signOut().then(() => location.href = "../"));
$("#form-login").addEventListener("submit", async e => { e.preventDefault(); const m = $("#login-msg"); m.className = "msg"; m.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error){ m.className = "msg err"; m.textContent = /invalid/i.test(error.message) ? "Adresse ou mot de passe incorrect." : error.message; } else $("#dlg-login").close(); });

sb.auth.onAuthStateChange(async (_e, session) => {
  const u = session?.user || null; if (u?.id === user?.id && role !== null) return;
  user = u; role = null;
  $("#btn-login").classList.toggle("hidden", !!user); $("#btn-logout").classList.toggle("hidden", !user);
  $("#who").textContent = user ? user.email : "";
  ["#page", "#outils"].forEach(s => $(s).classList.add("hidden")); $("#bloque").classList.remove("hidden");
  if (!user){ $("#bloque").textContent = "Les statistiques sont réservées. Connecte-toi pour les afficher."; return; }
  const { data: r } = await sb.rpc("flamme_mon_role"); role = r || "";
  if (!ACCES.includes(role)){ $("#bloque").textContent = "Les statistiques sont réservées au propriétaire."; return; }
  try {
    const [{ data: els, error }, { data: cols }, { data: voc }] = await Promise.all([sb.from("flamme_elements").select("*"), sb.from("flamme_couleurs").select("*"), sb.from("flamme_vocabulaire").select("*").eq("langue", "fr")]);
    if (error) throw new Error(error.message);
    E = Object.fromEntries(els.map(e => [e.code, e])); C = Object.fromEntries((cols || []).map(c => [c.code, c]));
    (voc || []).forEach(v => ((V[v.domaine] ??= {})[v.cle] = v));
    rendre(await lireScores());
    $("#bloque").classList.add("hidden"); ["#page", "#outils"].forEach(s => $(s).classList.remove("hidden"));
  } catch (err){ $("#bloque").textContent = err.message; }
});
</script>
